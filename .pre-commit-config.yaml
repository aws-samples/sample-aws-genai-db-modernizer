# Pre-commit hooks for Database Modernizer Assessment
# See https://pre-commit.com for more information

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']  # Allow custom tags in docker-compose
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: mixed-line-ending
        name: Check line endings
        args: ['--fix=lf']
      - id: detect-private-key
        name: Detect private keys

  # Secret scanning with detect-secrets (Python-based, no Go required)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: Format Python code with Black
        args: ['--line-length=100']

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports
        args: ['--profile=black', '--line-length=100']
        stages: [pre-commit]

  # Python linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        name: Lint Python code with Ruff
        args: ['--fix', '--exit-non-zero-on-fix']

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: Type check with mypy
        args: ['--ignore-missing-imports', '--no-strict-optional']
        additional_dependencies: ['pydantic>=2.7.2']

  # Python security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        name: Security check with Bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']

  # Semgrep security scanning
  - repo: local
    hooks:
      - id: semgrep
        name: Security scanning with Semgrep
        entry: uvx semgrep scan --config=auto --error --quiet
        language: system
        files: ^(src/|infrastructure/docker/)
        pass_filenames: false

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ['--fix', '--config', '.markdownlint.yaml']

  # Commit message validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        name: Validate commit message format
        stages: [commit-msg]

  # OpenAPI spec generation (auto-regenerate if API routes/models change)
  - repo: local
    hooks:
      - id: generate-openapi
        name: Generate OpenAPI spec
        entry: uv run python scripts/generate_api_spec.py
        language: system
        files: ^src/api/
        pass_filenames: false

  # JSON Schema validation
  - repo: local
    hooks:
      - id: validate-json-schemas
        name: Validate JSON schemas
        entry: uv run python scripts/validate_schemas.py
        language: system
        files: \.json$
        pass_filenames: true

  # Pydantic contract validation
  - repo: local
    hooks:
      - id: validate-pydantic-contracts
        name: Validate Pydantic contracts
        entry: uv run python scripts/validate_contracts.py
        language: system
        files: ^src/contracts/.*\.py$
        pass_filenames: true

  # Contract tests
  - repo: local
    hooks:
      - id: contract-tests
        name: Run contract validation tests
        entry: pytest tests/contract/ -v --tb=short
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]

  # CloudFormation validation with cfn-nag
  - repo: local
    hooks:
      - id: cfn-nag
        name: CloudFormation security scanning with cfn-nag
        entry: bash -c 'eval "$(rbenv init - bash)" && find infrastructure/cloudformation -name "*.yaml" -not -path "*/parameters/*" -exec cfn_nag_scan --input-path {} \;'
        language: system
        files: ^infrastructure/cloudformation/(?!parameters/).*\.yaml$
        pass_filenames: false

  # Infrastructure security scanning with Checkov (CloudFormation)
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.0
    hooks:
      - id: checkov
        name: Infrastructure security scanning with Checkov
        args: [
          '--directory', 'infrastructure/cloudformation',
          '--skip-path', 'infrastructure/cloudformation/parameters',
          '--framework', 'cloudformation',
          '--quiet',
          '--compact'
        ]
        files: ^infrastructure/cloudformation/(?!parameters/).*\.yaml$

  # Dockerfile security scanning with Checkov
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.0
    hooks:
      - id: checkov
        name: Dockerfile security scanning with Checkov
        args: [
          '--directory', 'infrastructure/docker',
          '--framework', 'dockerfile',
          '--quiet',
          '--compact'
        ]
        files: ^infrastructure/docker/.*/Dockerfile$

  # Validate Claude Code skills reference existing scripts and prompts
  - repo: local
    hooks:
      - id: validate-skills
        name: Validate Claude Code skills
        entry: uv run python scripts/validate_skills.py
        language: system
        files: '(\.claude/skills/.*\.md|scripts/run_.*\.py|src/contracts/.*\.py|src/skills/.*\.md)'
        pass_filenames: false

# Configuration
default_language_version:
  python: python3

# Skip hooks for specific commits
# Use: git commit --no-verify (use sparingly!)
