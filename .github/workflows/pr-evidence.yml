name: PR Evidence

# Compares the PR body's needs_llm_run verdict with ci/needs_llm_run.sh for the PR's diff,
# and asks for a result line on every required real-model run (#1153). Not a required
# check (a maintainer decision). The logic and its tests: ci/pr_evidence.py,
# tests/unit/ci/test_pr_evidence.py. Runs on fork PRs: no secrets, read-only token.
# The PR body is untrusted: it reaches the script only through an env var, never a shell line.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  # No-op pass, so making this check required later can never stall the merge queue.
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Nothing to check in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "The PR body was checked when the PR entered the queue."
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A PR's checkout is its merge into the base: HEAD^1 is the base's tip.
          fetch-depth: 2
          persist-credentials: false
      - name: Check the PR Evidence section
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 ci/pr_evidence.py check --body-env PR_BODY --author-env PR_AUTHOR --base HEAD^1
