name: Docs

# Builds the help site (mkdocs.yml, docs_dir: docs) plus the deterministic
# WordPress sample rendered into site/sample/ by scripts/build_docs_sample.py.
# PRs get the built site as a downloadable artifact; pushes to main that touch
# the site's own inputs deploy it to GitHub Pages. Replaces the old
# api-docs.yml (removed with the hosted API docs, #175/#341).

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "README.md"
      - "scripts/run_*.py"
      - "scripts/build_docs_sample.py"
      - "tests/e2e/pipeline.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "README.md"
      - "scripts/run_*.py"
      - "scripts/build_docs_sample.py"
      - "tests/e2e/pipeline.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked --extra docs --extra dev
      - name: Build the site
        run: uv run mkdocs build --strict
      - name: Render the sample report into the site
        run: uv run python scripts/build_docs_sample.py --site-dir site
      - name: Upload site artifact (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: site/
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
