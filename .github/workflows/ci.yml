name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Prepares for GitHub's merge queue: a required check must report on the
  # queue's merge group too. None of the jobs below read pull request
  # context, so they run unchanged. Harmless while the queue is off.
  merge_group:
  # Nightly: the full suite with the coverage gate (see the `test` job), on main.
  schedule:
    - cron: '23 4 * * *'

concurrency:
  # A newer push to a pull request cancels that pull request's older run
  # (#1174). merge_group, push and schedule runs are never cancelled: the
  # group is unique per run for them (a shared group would drop pending
  # runs). The required
  # `test` and `e2e` checks come from the replacing run's own jobs.
  group: ${{ github.workflow }}-${{ github.event.number && format('pr-{0}', github.event.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history, not the default shallow depth-1 clone: #570's
          # commit-message check (below) needs origin/main plus every
          # commit a pull request adds on top of it, which a shallow clone
          # of just the tip commit cannot provide.
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install uv
        # Caches uv's package cache across runs, keyed on uv.lock; one cache per
        # set of extras so a job never restores another job's smaller set.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: dev
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Pre-commit / CI version alignment
        # Fail if the pre-commit linter revs drift from the locked versions CI
        # runs, so a green hook always means a green CI lint. Not covered by
        # ci/lint.sh (it compares .pre-commit-config.yaml against uv.lock, not
        # a lint tool itself), so it stays a separate step.
        run: uv run python scripts/check_precommit_ci_alignment.py
      - name: Commit messages
        # A no-op on a push to main (see ci/check_commits.sh); on a pull
        # request, checks every non-merge commit ahead of origin/main.
        run: ./ci/check_commits.sh
      - name: Lint
        run: ./ci/lint.sh

  test-shard:
    # The unit, contract, property and graph suite (ci/test.sh) split into four
    # shards by recorded test durations (.test_durations, pytest-split; #956).
    # The required check is the `test` job below, which waits for every shard.
    name: test-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Coverage costs time on every test, so it runs on pushes to main and the
      # nightly run, where the `test` job combines the four shards' data and
      # applies the same 65% gate to the whole suite.
      COVERAGE: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && '1' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install uv
        # Caches uv's package cache across runs, keyed on uv.lock; one cache per
        # set of extras so a job never restores another job's smaller set.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: dev
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Install AWS Transform SDK
        # Not a project dependency (it ships only in the ATX container image), but
        # the atx_orchestrator tests import it. Installing it here means those tests
        # RUN in CI instead of being silently skipped — the gap that let issue #150
        # (stale PIPELINE_TOOLS registry) merge green.
        run: uv pip install "agent-builder-sdk-aws-transform>=1.0.0"
      - name: Run tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          TEST_SHARD: ${{ matrix.shard }}/4
        # Full suite (tests/), not just unit + contract. tests/graph, tests/integration
        # and tests/property previously never ran at PR time, which is how the ladybug
        # 0.20.4 binder break (tests/graph) reached the deploy pipeline unnoticed.
        #
        # -m "not integration and not e2e": integration tests need a live stack or
        #   manually generated artifacts, and e2e tests have their own dedicated job
        #   (see the `e2e` job below) with its own browser/Node prerequisites (this
        #   job installs only `--extra dev`, not `--extra e2e`), so both are
        #   deselected here. ci/test.sh itself also passes --ignore=tests/e2e: the
        #   marker alone can't stop pytest from importing tests/e2e/* (playwright,
        #   pypdf) during collection, which would fail without the e2e extra.
        # --fail-on-skip: a skipped test fails the build. Combined with the marker,
        #   this means nothing in the gated run may silently skip — the failure mode
        #   behind issues #150 and the dead load-test tests.
        # TEST_SHARD: this shard's share of the suite (see ci/test.sh).
        run: |
          if [ -n "$COVERAGE" ]; then
            ./ci/test.sh --cov=src --cov-report=
          else
            ./ci/test.sh
          fi
      - name: Upload coverage data
        if: env.COVERAGE == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  test:
    # The required `test` check: green only when every shard passed. `always()`
    # makes it report (and fail) when a shard failed or was cancelled, rather
    # than being skipped, which a required check would read as missing.
    if: always()
    needs: test-shard
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          echo "test-shard result: $RESULT"
          [ "$RESULT" = "success" ]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'push' || github.event_name == 'schedule'
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        if: github.event_name == 'push' || github.event_name == 'schedule'
        with:
          python-version: '3.12'
      - name: Install uv
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: dev
      - name: Install dependencies
        if: github.event_name == 'push' || github.event_name == 'schedule'
        run: uv sync --locked --extra dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.event_name == 'push' || github.event_name == 'schedule'
        with:
          pattern: coverage-*
          path: coverage-data
      - name: Coverage gate (whole suite, 65%)
        # The same threshold the unsharded job enforced, over the four shards'
        # combined data.
        if: github.event_name == 'push' || github.event_name == 'schedule'
        run: |
          uv run coverage combine coverage-data/coverage-*/.coverage
          uv run coverage report --fail-under=65

  e2e-shard:
    # The deterministic end-to-end suite (ci/e2e.sh) split seven ways (#956): the
    # report checks of each sample, the two determinism suites, the report checks
    # tied to no sample, and the UI smoke + help site checks. Only the `ui` shard builds the UI and the help
    # site; the report shards need neither. The required check is the `e2e` job
    # below, which waits for every shard.
    name: e2e-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A normal run takes well under 30 minutes; the extra headroom absorbs slow
    # Ubuntu package mirrors (#443) so a slow install doesn't cancel passing tests.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [wordpress, discourse, trailgear, hashseed, determinism, cross, ui]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: matrix.shard == 'ui'
        with:
          node-version: '22'
      - name: Install uv
        # Caches uv's package cache across runs, keyed on uv.lock; one cache per
        # set of extras so a job never restores another job's smaller set.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: e2e
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra e2e --extra docs
      - name: Playwright version
        id: playwright
        run: echo "version=$(awk '/^name = "playwright"$/ {getline; print $3; exit}' uv.lock | tr -d '"')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        # Most runs then never download (#1346). The ui shard installs chromium
        # only, the others chromium and webkit, so they keep separate caches.
        if: matrix.shard != 'hashseed'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.shard == 'ui' && 'chromium' || 'chromium-webkit' }}
      - name: End-to-end
        env:
          E2E_SHARD: ${{ matrix.shard }}
        run: ./ci/e2e.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  e2e:
    # The required `e2e` check: green only when every shard passed (see `test`).
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-shard result: $RESULT"
          [ "$RESULT" = "success" ]

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Gitleaks secret scan
        # Same image and config as the internal validation pipeline (#216).
        # Runs before dependency install so .venv is not scanned.
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source . --config .gitleaks.toml --no-git --redact
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install uv
        # Caches uv's package cache across runs, keyed on uv.lock; one cache per
        # set of extras so a job never restores another job's smaller set.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: dev
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Bandit security scan
        run: uv run bandit -r src/ -c pyproject.toml
      - name: Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/python p/security-audit
      - name: cfn-lint
        # Scoped to the CloudFormation templates that still exist after #175:
        # the one remaining hosted-path template (automation.yaml, kept per
        # maintainer decision — see #342), the CI-runner IAM sample, and the
        # AWS Transform integration's IAM roles template. W3037 is cfn-lint's
        # IAM-action-prefix check; its bundled service list doesn't yet know
        # about bedrock-runtime or transform-agents, both real AWS actions.
        run: |
          uv run cfn-lint infrastructure/cloudformation/automation.yaml \
            infrastructure/cloudformation/example-ci-runner-iam.yaml \
            pipeline/iam-roles.yaml \
            --ignore-checks W3037
      - name: Checkov (CloudFormation)
        run: |
          pip install checkov
          checkov -f infrastructure/cloudformation/automation.yaml \
            -f infrastructure/cloudformation/example-ci-runner-iam.yaml \
            -f pipeline/iam-roles.yaml \
            --framework cloudformation --quiet --compact \
            --skip-check CKV_AWS_46,CKV_AWS_111,CKV2_AWS_71
      - name: Checkov (Dockerfiles)
        run: |
          checkov -f src/atx_orchestrator/Dockerfile.atx \
            -f infrastructure/docker/agent-load-test/Dockerfile \
            --framework dockerfile --quiet --compact

  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A pull request's checkout is its merge into main: HEAD^1 is main's tip,
          # the base the pending-bump step compares the contract snapshots with.
          fetch-depth: 2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install uv
        # Caches uv's package cache across runs, keyed on uv.lock; one cache per
        # set of extras so a job never restores another job's smaller set.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: dev
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Validate contracts
        # tests/contract/ (including the schema snapshot check) runs in the
        # `test` shards; this job runs only the contract validation script,
        # which no test covers (#956).
        run: uv run python scripts/validate_contracts.py src/contracts/*.py
      - name: Check pending contract bumps
        # A pull request declares a bump kind in src/contracts/pending/ and the number is
        # assigned after its last rebase (ADR-008 Decision 8). Pending files are valid on
        # a pull request; the merge queue and main refuse them, so main never holds one.
        # It also compares the contracts with main's committed snapshots (--against), so
        # a shape change with no version move and no pending file fails even when the
        # branch regenerated its own snapshot. The base is main's tip: HEAD^1 of a pull
        # request's merge commit, the merge group's base, or the commit before a push.
        env:
          REQUIRE_RESOLVED: ${{ github.event_name != 'pull_request' && '--require-resolved' || '' }}
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            merge_group) base="$MERGE_GROUP_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          against=()
          if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ]; then
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch -q --depth=1 origin "$base"
            against=(--against "$base")
          fi
          uv run python scripts/resolve_contract_versions.py --check $REQUIRE_RESOLVED "${against[@]}"
      - name: Check no test pins a contract version
        # Bumps every contract one MINOR in a scratch worktree, as the resolver does
        # after the last rebase, and runs the tests that mention a contract version,
        # so a test that compares with a literal version fails here, before review,
        # not on the resolved branch (#1226).
        # About 4 minutes on a hosted runner, under the e2e and test-shard wall time.
        run: uv run python scripts/check_version_pins.py -n auto

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
        working-directory: src/ui
      - name: Unit tests
        # Jest via react-scripts; CI=true makes it run once (no watch mode) and
        # fail on any failing test. Covers the HTML export escaping (#242).
        run: npm run test:ci
        working-directory: src/ui
        env:
          CI: true
      - name: Build
        run: npx react-scripts build
        working-directory: src/ui
        env:
          CI: false
