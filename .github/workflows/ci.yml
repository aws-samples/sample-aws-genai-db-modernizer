name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Ruff check
        run: uv run ruff check src/ tests/
      - name: Black check
        run: uv run black --check src/ tests/
      - name: isort check
        # Same args as the isort pre-commit hook, so the hook and CI agree.
        run: uv run isort --profile=black --line-length=100 --check-only src/ tests/
      - name: Pre-commit / CI version alignment
        # Fail if the pre-commit linter revs drift from the locked versions CI
        # runs, so a green hook always means a green CI lint.
        run: uv run python scripts/check_precommit_ci_alignment.py
      - name: Mypy
        run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Install AWS Transform SDK
        # Not a project dependency (it ships only in the ATX container image), but
        # the atx_orchestrator tests import it. Installing it here means those tests
        # RUN in CI instead of being silently skipped — the gap that let issue #150
        # (stale PIPELINE_TOOLS registry) merge green.
        run: uv pip install "agent-builder-sdk-aws-transform>=1.0.0"
      - name: Run tests
        env:
          AWS_DEFAULT_REGION: us-east-1
        # Full suite (tests/), not just unit + contract. tests/graph, tests/integration
        # and tests/property previously never ran at PR time, which is how the ladybug
        # 0.20.4 binder break (tests/graph) reached the deploy pipeline unnoticed.
        #
        # -m "not integration": integration tests need a live stack or manually
        #   generated artifacts, so they are deselected here and run post-deploy.
        # --fail-on-skip: a skipped test fails the build. Combined with the marker,
        #   this means nothing in the gated run may silently skip — the failure mode
        #   behind issues #150 and the dead load-test tests.
        run: uv run pytest tests/ -m "not integration" --fail-on-skip -v --cov=src --cov-report=term --cov-fail-under=65

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Bandit security scan
        run: uv run bandit -r src/ -c pyproject.toml
      - name: Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/python p/security-audit
      - name: Checkov (CloudFormation)
        run: |
          pip install checkov
          checkov -d infrastructure/cloudformation/ --framework cloudformation --quiet \
            --skip-check CKV_AWS_46,CKV_AWS_111,CKV2_AWS_71

  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Validate contracts
        run: uv run python scripts/validate_contracts.py src/contracts/*.py
      - name: Contract tests
        run: uv run pytest tests/contract/ -v

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
        working-directory: src/ui
      - name: Build
        run: npx react-scripts build
        working-directory: src/ui
        env:
          CI: false

  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: Lint CloudFormation templates
        run: cfn-lint infrastructure/cloudformation/*.yaml
