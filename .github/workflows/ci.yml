name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Pre-commit / CI version alignment
        # Fail if the pre-commit linter revs drift from the locked versions CI
        # runs, so a green hook always means a green CI lint. Not covered by
        # ci/lint.sh (it compares .pre-commit-config.yaml against uv.lock, not
        # a lint tool itself), so it stays a separate step.
        run: uv run python scripts/check_precommit_ci_alignment.py
      - name: Lint
        run: ./ci/lint.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Install AWS Transform SDK
        # Not a project dependency (it ships only in the ATX container image), but
        # the atx_orchestrator tests import it. Installing it here means those tests
        # RUN in CI instead of being silently skipped — the gap that let issue #150
        # (stale PIPELINE_TOOLS registry) merge green.
        run: uv pip install "agent-builder-sdk-aws-transform>=1.0.0"
      - name: Run tests
        env:
          AWS_DEFAULT_REGION: us-east-1
        # Full suite (tests/), not just unit + contract. tests/graph, tests/integration
        # and tests/property previously never ran at PR time, which is how the ladybug
        # 0.20.4 binder break (tests/graph) reached the deploy pipeline unnoticed.
        #
        # -m "not integration and not e2e": integration tests need a live stack or
        #   manually generated artifacts, and e2e tests have their own dedicated job
        #   (see the `e2e` job below) with its own browser/Node prerequisites (this
        #   job installs only `--extra dev`, not `--extra e2e`), so both are
        #   deselected here. ci/test.sh itself also passes --ignore=tests/e2e: the
        #   marker alone can't stop pytest from importing tests/e2e/* (playwright,
        #   pypdf) during collection, which would fail without the e2e extra.
        # --fail-on-skip: a skipped test fails the build. Combined with the marker,
        #   this means nothing in the gated run may silently skip — the failure mode
        #   behind issues #150 and the dead load-test tests.
        run: ./ci/test.sh --cov=src --cov-report=term --cov-fail-under=65

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra e2e
      - name: End-to-end
        run: ./ci/e2e.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: test-results/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Gitleaks secret scan
        # Same image and config as the internal validation pipeline (#216).
        # Runs before dependency install so .venv is not scanned.
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source . --config .gitleaks.toml --no-git --redact
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Bandit security scan
        run: uv run bandit -r src/ -c pyproject.toml
      - name: Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/python p/security-audit
      - name: Checkov (CloudFormation)
        run: |
          pip install checkov
          checkov -d infrastructure/cloudformation/ --framework cloudformation --quiet \
            --skip-check CKV_AWS_46,CKV_AWS_111,CKV2_AWS_71

  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Validate contracts
        run: uv run python scripts/validate_contracts.py src/contracts/*.py
      - name: Contract tests
        run: uv run pytest tests/contract/ -v

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
        working-directory: src/ui
      - name: Unit tests
        # Jest via react-scripts; CI=true makes it run once (no watch mode) and
        # fail on any failing test. Covers the HTML export escaping (#242).
        run: npm run test:ci
        working-directory: src/ui
        env:
          CI: true
      - name: Build
        run: npx react-scripts build
        working-directory: src/ui
        env:
          CI: false

  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: Lint CloudFormation templates
        run: cfn-lint infrastructure/cloudformation/*.yaml
