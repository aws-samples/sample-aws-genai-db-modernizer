name: Contract MAJOR gate

# Fails when a PR moves the assess() contract version (request or result) without a
# maintainer's approval: "contract-major" for a MAJOR ("Contract Major Approved" still
# counts), "contract-minor" for a MINOR, on the PR when the check runs and applied by a
# user with the maintain or admin role (#1648, #2176). Internal contracts need no label. The logic
# and its tests: ci/contract_major_gate.py, tests/unit/ci/test_contract_major_gate.py.
# Labels, label events and roles are read from the API with a read-only token, not
# from the event payload, so a rerun sees the current labels.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  # For GitHub's merge queue: a required check must report on the merge group too.
  # The script finds the PR from the queue's ref and checks only its own commits.
  merge_group:

permissions:
  contents: read
  issues: read
  pull-requests: read

# Only the newest run per PR counts, so a quick label then unlabel can't leave an
# older result as the latest one.
concurrency:
  group: contract-major-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-major-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A PR's checkout is its merge into the base: HEAD^1 is the base's tip. A
          # merge group needs full history: the queue rebases the entry's commits, and
          # the script reads the revision before them.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}
          persist-credentials: false
      - name: Check the assess() contract version approvals
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        # The gate never runs the pull request's own copy of its script (#2176): it takes
        # ci/contract_major_gate.py from the base (main's tip for a pull request, the
        # group's base in the merge queue) and runs it on the tree under test. The
        # script is standard library only, so that one file is all it needs.
        run: |
          case "$EVENT" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            merge_group) base="$MERGE_GROUP_BASE" ;;
            *) echo "::error::unexpected event $EVENT"; exit 2 ;;
          esac
          gate="$RUNNER_TEMP/contract_major_gate.py"
          git show "$base:ci/contract_major_gate.py" > "$gate"
          case "$EVENT" in
            pull_request)
              python3 "$gate" --base "$base" --head HEAD --pr "$PR_NUMBER" ;;
            merge_group)
              python3 "$gate" --base "$base" --head HEAD --merge-group-ref "$MERGE_GROUP_REF" ;;
          esac
