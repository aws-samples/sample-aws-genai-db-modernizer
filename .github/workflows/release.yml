name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine pre-release
        id: prerelease
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" == *"-rc"* ]] || [[ "$TAG_NAME" == *"-alpha"* ]] || [[ "$TAG_NAME" == *"-beta"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get previous tag
        id: prev_tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "$TAG_NAME" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            echo "range=" >> "$GITHUB_OUTPUT"
          else
            echo "range=$PREV_TAG..$TAG_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: notes
        env:
          TAG_NAME: ${{ github.ref_name }}
          RANGE: ${{ steps.prev_tag.outputs.range }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "notes<<EOF"

            if [ -n "$RANGE" ]; then
              echo "## What's Changed"
              echo ""

              # Features
              FEATS=$(git log "$RANGE" --pretty=format:"- %s" --grep="^feat" 2>/dev/null)
              if [ -n "$FEATS" ]; then
                echo "### Features"
                echo "$FEATS"
                echo ""
              fi

              # Fixes
              FIXES=$(git log "$RANGE" --pretty=format:"- %s" --grep="^fix" 2>/dev/null)
              if [ -n "$FIXES" ]; then
                echo "### Bug Fixes"
                echo "$FIXES"
                echo ""
              fi

              # Docs
              DOCS=$(git log "$RANGE" --pretty=format:"- %s" --grep="^docs" 2>/dev/null)
              if [ -n "$DOCS" ]; then
                echo "### Documentation"
                echo "$DOCS"
                echo ""
              fi

              # Everything else
              OTHER=$(git log "$RANGE" --pretty=format:"- %s" --grep="^chore\|^ci\|^refactor\|^perf\|^test" 2>/dev/null)
              if [ -n "$OTHER" ]; then
                echo "### Maintenance"
                echo "$OTHER"
                echo ""
              fi

              echo "---"
              echo "**Full Changelog**: https://github.com/$REPO/compare/$RANGE"
            else
              echo "Initial release"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: false
