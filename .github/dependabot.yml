version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/src/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    versioning-strategy: "lockfile-only"
    groups:
      all-js:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      all-python:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
