version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/src/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    versioning-strategy: "lockfile-only"
    cooldown:
      default-days: 7
    groups:
      all-js:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
      # One grouped PR for every open npm security update instead of one PR
      # per advisory. Security updates ignore open-pull-requests-limit: 0.
      js-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      all-python:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
      # One grouped PR for every open uv security update.
      python-security:
        applies-to: security-updates
        patterns: ["*"]
