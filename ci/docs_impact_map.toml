# The docs-impact map (#1162): changed source paths (globs) -> the pages to review.
#
# ci/pre_merge.sh reads it. When a branch changes a mapped path but none of that entry's
# pages, it warns and lists the pages; it fails unless the PR body (or a commit message)
# has a "Docs: <reason>" line saying why they need no change. Keep the map small and
# honest: add an entry where a page has drifted from the code before, not for every module.
#
# * paths: globs against repo-relative paths; "*" stays inside one folder, "**" crosses folders.
# * docs: the doc pages, help-site pages and command files that describe those paths.
# * why: what drifted, or what the pages say about the paths.
#
# tests/unit/docs/test_docs_impact_map.py checks that every page exists and every path matches
# a tracked file. Rationale and the rule: ci/README.md and CONTRIBUTING.md.
#
# Claim-bearing pages are listed without an entry here (#1851): each test file a claim marker
# (<!-- claim: tests/...::test_name -->) cites is an entry of its own, derived from the markers
# when the step runs (ci/pre_merge.py docs_impact_entries), whose pages are the pages that cite
# it. `uv run python ci/claims.py list` prints them.

[[entry]]
name = "report-and-deliverables"
paths = ["src/report/**", "scripts/run_report.py"]
docs = [
  "docs/understand-the-results.md",
  "docs/sample.md",
  "docs/other-ways-to-run-it.md",
  "README.md",
  ".claude/commands/synthesize.md",
]
why = "The pages describe the deliverables and what each report section shows; the deliverables list drifted once (tests/unit/docs/test_deliverables_lists.py now pins the file names, not the prose)."

[[entry]]
name = "results-page"
paths = ["src/ui/src/pages/AnalysisResults.js", "src/ui/src/pages/AssignmentGate.js"]
docs = ["docs/understand-the-results.md", "docs/use-claude-code.md"]
why = "The help site describes the results page order and the approval gate; no test ties the prose to the page's section order."

