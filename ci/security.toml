# The one security-scan configuration (#1844), read by ci/security.py. Pre-commit, the
# GitHub `security` job and ci/pre_merge.sh all run ci/security.sh, so they all scan
# with exactly what this file names; tests/unit/ci/test_security_parity.py keeps it so.
#
# Semgrep rules are pinned by git commit, not taken from the live registry: a registry
# ruleset (`p/python`, `--config=auto`) changes under a fixed tree, so main could turn
# red with no code change (#1708). They are not vendored either: the Semgrep Rules
# License allows internal use only and forbids distributing the rules, and this
# repository is public. ci/security.py fetches each source at its commit into a local
# cache (git checks the commit id), keeps only the files listed here, and gives each
# rule its registry id, so `nosemgrep: <rule id>` comments keep working.
#
# The list: every rule file behind the registry rulesets `p/python` and
# `p/security-audit` (the GitHub job's old config) and behind `--config=auto` for this
# repository (the old pre-commit hook's), as resolved on 2026-11-04. 684 of those
# rules live in semgrep/semgrep-rules and 7 in trailofbits/semgrep-rules.
#
# To move a pin: change `commit`, write the new `rules_sha256` (./ci/security.sh
# --print-rules-sha256), run ./ci/security.sh (the whole tree), and fix or justify every
# new finding in the same pull request. A listed file the new commit
# no longer has fails the run, naming it.

[semgrep]
# The engine's version; it and every dependency are pinned with hashes in
# ci/semgrep-requirements.txt (the file's header says how to regenerate it).
version = "1.183.0"
# SHA-256 over every listed rule file (source, path, bytes). A run refuses rule files that
# don't match it. After moving a commit or changing a list, write the value that
# `./ci/security.sh --print-rules-sha256` prints.
rules_sha256 = "9d2c1a2ce9e86f3d7e4cdb6a0af46a8231d82f4de69d29947396afa25164e1a4"  # pragma: allowlist secret

[[semgrep.source]]
name = "semgrep"
url = "https://github.com/semgrep/semgrep-rules"
commit = "16b9e6d45f10649f6a531ec4838ed9924372c3bc"  # 2026-10-21; a git commit id  # pragma: allowlist secret
# A rule's id is its file path, dotted, then its own id (the registry's form).
id_prefix = ""
