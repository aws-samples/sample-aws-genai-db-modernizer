name = "trailofbits"
url = "https://github.com/trailofbits/semgrep-rules"
commit = "31390b3a99c04c81522d1b37c8d1900aa2dd4094"  # 2025-11-12; a git commit id  # pragma: allowlist secret
id_prefix = "trailofbits"
rules = [
  "python/automatic-memory-pinning.yaml",
  "python/lxml-in-pandas.yaml",
  "python/numpy-in-pytorch-modules.yaml",
  "python/pickles-in-numpy.yaml",
