# ═══════════════════════════════════════════════════════════════════════════
# CDC-cache — Debezium Server config (env-templated; Quarkus resolves ${VAR:default})
# Source: Aurora MySQL (binlog)
# Sink:   Broker Valkey (Redis Streams, internal, no TLS)
# Offset + Schema History: the SAME broker Valkey (Option B — no SQLite/EFS)
# Secrets (DB user and password) are injected by ECS from the Secrets Manager secret.
# ═══════════════════════════════════════════════════════════════════════════

# --- Quarkus Runtime ---
quarkus.log.console.json=false
quarkus.log.level=INFO
quarkus.http.port=8080

# --- Event Format (flat JSON, no schema envelope) ---
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

# ═══════════════════════════════════════════════════════════════════════════
# SINK: Broker Valkey (Redis Streams)
# ═══════════════════════════════════════════════════════════════════════════
debezium.sink.type=redis
debezium.sink.redis.address=${BROKER_HOST}:${BROKER_PORT:6379}
debezium.sink.redis.ssl.enabled=${BROKER_SSL:false}
debezium.sink.redis.batch.size=${SINK_BATCH_SIZE:2000}
debezium.sink.redis.message.format=extended

# ═══════════════════════════════════════════════════════════════════════════
# SOURCE: Aurora MySQL
# ═══════════════════════════════════════════════════════════════════════════
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.database.hostname=${SOURCE_DB_HOST}
debezium.source.database.port=${SOURCE_DB_PORT:3306}
# SOURCE_DB_USER / SOURCE_DB_PASSWORD are injected by ECS from the DB secret (DBSecretArn).
debezium.source.database.user=${SOURCE_DB_USER}
debezium.source.database.password=${SOURCE_DB_PASSWORD}
debezium.source.database.server.id=${SERVER_ID:88888}
debezium.source.topic.prefix=${TOPIC_PREFIX:cdc-cache}
debezium.source.database.include.list=${SOURCE_DB_NAME}
debezium.source.table.include.list=${TABLE_INCLUDE_LIST}

# Snapshot: schema_only by default — the parallel bulk loader does the initial
# data load; Debezium captures schema and streams binlog from the current point.
# Set SNAPSHOT_MODE=initial for a full Debezium snapshot instead.
debezium.source.snapshot.mode=${SNAPSHOT_MODE:schema_only}
debezium.source.heartbeat.interval.ms=10000
debezium.source.decimal.handling.mode=string
debezium.source.include.schema.changes=false
debezium.source.tombstones.on.delete=false

# Throughput tuning — larger read batches + tight poll so the single binlog
# reader isn't throttled; bigger sink pipeline to the broker.
debezium.source.max.batch.size=${MAX_BATCH_SIZE:8192}
debezium.source.max.queue.size=${MAX_QUEUE_SIZE:32768}
debezium.source.poll.interval.ms=${POLL_INTERVAL_MS:10}

# ═══════════════════════════════════════════════════════════════════════════
# OFFSET + SCHEMA HISTORY: the broker Valkey itself (Option B)
# Dedicated metadata: keys, separate from data:* streams. wait.enabled makes
# each offset commit wait for replica acknowledgement (tight failover window).
# Durability = broker Multi-AZ + snapshots. No SQLite / EFS.
# ═══════════════════════════════════════════════════════════════════════════
debezium.source.offset.storage=io.debezium.storage.redis.offset.RedisOffsetBackingStore
debezium.source.offset.storage.redis.address=${BROKER_HOST}:${BROKER_PORT:6379}
debezium.source.offset.storage.redis.ssl.enabled=${BROKER_SSL:false}
debezium.source.offset.storage.redis.key=${OFFSET_KEY:cdc-cache:metadata:offsets}
debezium.source.offset.storage.redis.wait.enabled=true
debezium.source.offset.storage.redis.wait.timeout.ms=1000
debezium.source.offset.flush.interval.ms=1000
debezium.source.schema.history.internal=io.debezium.storage.redis.history.RedisSchemaHistory
debezium.source.schema.history.internal.redis.address=${BROKER_HOST}:${BROKER_PORT:6379}
debezium.source.schema.history.internal.redis.ssl.enabled=${BROKER_SSL:false}
debezium.source.schema.history.internal.redis.key=${SCHEMA_HISTORY_KEY:cdc-cache:metadata:schema_history}

# ═══════════════════════════════════════════════════════════════════════════
# TRANSFORMS: route every table to a data:<topic> stream key
# ═══════════════════════════════════════════════════════════════════════════
debezium.transforms=AddPrefix
debezium.transforms.AddPrefix.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.AddPrefix.regex=.*
debezium.transforms.AddPrefix.replacement=data:$0
