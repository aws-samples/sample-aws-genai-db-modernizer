# CDC-cache Debezium Server — CDC to single-shard managed broker (verification)
quarkus.http.port=8080
quarkus.log.level=INFO

debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

# SINK: single-shard managed broker (cluster mode disabled, no TLS, internal)
debezium.sink.type=redis
debezium.sink.redis.address=${BROKER_HOST}:6379
debezium.sink.redis.ssl.enabled=false
debezium.sink.redis.batch.size=500
debezium.sink.redis.message.format=extended

# SOURCE: Aurora MySQL — stream only (schema_only: no data snapshot; bulk loader did the load)
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.database.hostname=${SOURCE_DB_HOST}
debezium.source.database.port=3306
# SOURCE_DB_USER / SOURCE_DB_PASSWORD are injected by ECS from the DB secret (DBSecretArn).
debezium.source.database.user=${SOURCE_DB_USER}
debezium.source.database.password=${SOURCE_DB_PASSWORD}
debezium.source.database.server.id=77777
debezium.source.topic.prefix=cdc-cache
debezium.source.database.include.list=Inventory
debezium.source.table.include.list=Inventory.orders
debezium.source.snapshot.mode=schema_only
debezium.source.decimal.handling.mode=string
debezium.source.include.schema.changes=false
debezium.source.tombstones.on.delete=false

# OFFSET + SCHEMA HISTORY: stored in the broker Valkey itself (Option B).
# No SQLite / EFS. Survives Debezium host/container restart; durability comes
# from the broker's Multi-AZ + snapshots. Keys use a dedicated metadata: prefix,
# separate from the data:* streams. wait.enabled makes each offset commit wait
# for replica acknowledgement, tightening the failover loss window to ~zero.
debezium.source.offset.storage=io.debezium.storage.redis.offset.RedisOffsetBackingStore
debezium.source.offset.storage.redis.address=${BROKER_HOST}:6379
debezium.source.offset.storage.redis.ssl.enabled=false
debezium.source.offset.storage.redis.key=cdc-cache:metadata:offsets
debezium.source.offset.storage.redis.wait.enabled=true
debezium.source.offset.storage.redis.wait.timeout.ms=1000
debezium.source.offset.flush.interval.ms=1000
debezium.source.schema.history.internal=io.debezium.storage.redis.history.RedisSchemaHistory
debezium.source.schema.history.internal.redis.address=${BROKER_HOST}:6379
debezium.source.schema.history.internal.redis.ssl.enabled=false
debezium.source.schema.history.internal.redis.key=cdc-cache:metadata:schema_history

# Route every table to a data:<topic> stream key
debezium.transforms=AddPrefix
debezium.transforms.AddPrefix.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.AddPrefix.regex=.*
debezium.transforms.AddPrefix.replacement=data:$0
