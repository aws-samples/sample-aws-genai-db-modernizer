[project]
name = "database-modernizer"
version = "1.0.0"
description = "AI-powered database modernization analysis and recommendation system"
authors = [
    {name = "Amazon Web Services"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT-0"}

dependencies = [
    # Strands Agent Framework
    "strands-agents>=1.0.0",

    # Web Framework & API
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",

    # Database Connectors
    "mysql-connector-python==8.2.0",
    "psycopg2-binary==2.9.10",
    "pymssql>=2.3.0",

    # Data Validation & Serialization
    "pydantic>=2.7.2",
    "jsonschema==4.20.0",

    # Configuration & Logging
    "pyyaml==6.0.1",
    "python-dotenv==1.0.0",
    "structlog==23.2.0",

    # AWS SDK
    "boto3>=1.34.0",

    # Template rendering (k6 script generation)
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-xdist==3.5.0",
    "black==23.11.0",
    "isort==5.13.2",
    "ruff==0.15.15",
    "mypy==1.7.1",
    "bandit==1.7.6",
    "hypothesis>=6.0.0",
    "pre-commit>=3.0.0",
    "detect-secrets>=1.4.0",
    "cfn-lint>=0.83.0",
    "moto[s3,stepfunctions,logs]>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "contract: marks tests as contract validation tests",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.bandit]
exclude_dirs = ["tests", "scripts/ci-database"]
# B608: SQL injection — suppressed inline with nosec B608 where applicable

[tool.hypothesis]
database = ".hypothesis/examples"
