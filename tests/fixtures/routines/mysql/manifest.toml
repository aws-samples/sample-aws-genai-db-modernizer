# Synthetic MySQL routines for the routine checker's tests (#1936). Every routine here is
# made up for the tests; none comes from a customer. Checked with target_user = "admin".
#
# Per routine: file, kind, sql_mode (default STRICT_TRANS_TABLES), optional security_type
# and definer metadata, the expected status, parsed flag, findings ("<rule id>:<evidence>"),
# dependencies ("table:<schema>.<name>" or "routine:<schema>.<name>", schema may be empty)
# and dependencies_complete (default true).

[[routine]]
file = "clean-procedure.sql"
kind = "procedure"
status = "as_is"
parsed = true
findings = []
dependencies = ["routine:.order_tax", "routine:audit.log_event", "table:.order_history", "table:.order_lines", "table:.orders"]

