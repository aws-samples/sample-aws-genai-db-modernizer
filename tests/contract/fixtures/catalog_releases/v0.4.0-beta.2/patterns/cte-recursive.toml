# Detection signals: WITH RECURSIVE, hierarchical data traversal
[engines.aurora_postgresql]
kind = "fit"
supported = true
catalog = "aurora_pg"
catalog_id = "aurora-pg-01"
score = 95
why = "Recursive CTEs (WITH RECURSIVE) for hierarchical data traversal: org charts, category trees, bills of materials, with the SEARCH and CYCLE clauses for traversal order and cycle detection and no default recursion limit (PostgreSQL documentation, WITH Queries)."
concerns = [
    "Deep recursion (>100 levels) may require LIMIT on recursion depth.",
]
table_bonus = 15
complexity_feature = true

[engines.aurora_mysql]
kind = "fit"
supported = true
catalog = "aurora_mysql"
catalog_id = "aurora-mysql-08"
score = 90
why = "Recursive CTEs (WITH RECURSIVE) for hierarchical data traversal on MySQL 8.0, which Aurora MySQL version 3 is compatible with; recursion stops at cte_max_recursion_depth (1000 by default) and there is no SEARCH or CYCLE clause, so cycles are guarded in the query (MySQL Reference Manual, WITH (Common Table Expressions))."
concerns = [
    "Deep hierarchies need cte_max_recursion_depth raised, and a cycle needs a guard in the query.",
]
table_bonus = 15
complexity_feature = true

