# Detection signals: WHERE col IN (...) with multiple values
[engines.aurora_postgresql]
kind = "fit"
supported = true
catalog = "aurora_common"
catalog_id = "aurora-common-11"
score = 70
why = "Batch lookups using WHERE column IN (...) with multiple values: one index scan probes every listed value (PostgreSQL documentation, Indexes, a ScalarArrayOpExpr on a B-tree; MySQL Reference Manual, Range Optimization, equality ranges for IN lists), with no item limit, where DynamoDB's BatchGetItem takes at most 100 keys and 16 MB (Amazon DynamoDB API Reference, BatchGetItem). In the key-lookup class it raises no score: key-value-lookup rates the same read at 80."
concerns = [
    "Very large IN-lists (>1000 values) may benefit from temporary tables or joins.",
]

