# Pattern range-query. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "range-query"
name = "Range query"
detectors = [
    "src.tools.analysis.dynamodb_analysis_tools:analyze_dynamodb_use_cases",
]
triage_signal = "range_queries"
penalty = 0

# Detection (#920, #728): a SELECT with a scope that reads one table, pins a key column of it to a value and
# bounds another column of the same table by a range (the facade's ranges, the one range
# definition): a partition-key equality plus a sort-key range. Not any range plus ORDER BY.
# (src/tools/analysis/key_access.py, partition_range)
[engines.dynamodb]
kind = "fit"
supported = true
catalog = "dynamodb"
catalog_id = "dynamodb-02"
score = 90
why = "Queries that pin a partition key value and bound a sort key by a range: a DynamoDB Query with a KeyConditionExpression, returned in sort-key order, at most 1 MB per page; with a local secondary index an item collection is limited to 10 GB (Amazon DynamoDB API Reference, Query; Amazon DynamoDB Developer Guide, Local secondary indexes)."
concerns = [
    "Result sets exceeding 1MB require pagination, which is not the same as SQL",
    "Complex filter expressions evaluated after read (consume RCUs)",
]
table_bonus = 10

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.elasticache]
kind = "unscored"
supported = true
why = "ElastiCache's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.aurora_postgresql]
kind = "unscored"
supported = true
why = "Aurora PostgreSQL's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.aurora_mysql]
