# Pattern session-store. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "session-store"
name = "Session store"
detectors = [
    "src.tools.analysis.dynamodb_analysis_tools:analyze_dynamodb_use_cases",
    "src.tools.analysis.redis_analysis_tools:analyze_redis_use_cases",
]
triage_signal = "session_store"
penalty = 0

# Detection (#920): DynamoDB's analysis needs a session or token statement whose
# access-pattern class is keyed (a key lookup or key-scoped read or write), not any
# statement that names a token. ElastiCache's overlay detector is unchanged.
[engines.dynamodb]
kind = "fit"
supported = true
catalog = "dynamodb"
catalog_id = "dynamodb-06"
score = 90
why = "User session data read and written by its session or user key at high throughput: GetItem and PutItem on the key, with Time to Live to expire old sessions, though manual or application-managed cleanup also works (Amazon DynamoDB Developer Guide, Time to Live)."
concerns = [
    "Without TTL, application must manage session cleanup to avoid unbounded growth",
]
table_bonus = 12

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.elasticache]
