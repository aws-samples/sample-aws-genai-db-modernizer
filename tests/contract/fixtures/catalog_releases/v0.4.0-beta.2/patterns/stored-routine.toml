# Pattern stored-routine. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "stored-routine"
name = "Stored routine"
detectors = [
    "src.tools.analysis.aurora_mysql_analysis_tools:detect_mysql_specific_features",
    "src.tools.analysis.aurora_pg_analysis_tools:detect_pg_specific_features",
]
penalty = 0

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

