[engines.aurora_postgresql]
kind = "fit"
supported = true
catalog = "aurora_pg"
catalog_id = "aurora-pg-08"
score = 70
why = "Functions and procedures in PL/pgSQL (CALL, CREATE PROCEDURE, CREATE FUNCTION; a SQL Server EXEC of a procedure) encapsulate business logic server-side, reducing network round trips for multi-step operations (PostgreSQL documentation, User-Defined Procedures)."
concerns = [
    "Stored routines increase operational complexity and are harder to version-control.",
    "Consider migrating complex logic to application layer for testability.",
]
complexity_feature = true

