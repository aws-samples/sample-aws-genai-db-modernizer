# Pattern graph-traversal-hierarchy. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "graph-traversal-hierarchy"
name = "Graph traversal or hierarchy"
detectors = [
    "src.tools.analysis.documentdb_analysis_tools:analyze_documentdb_use_cases",
]
penalty = 10
penalty_basis = "bounded_limit"

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection signals: self-referential FK, recursive CTE, hierarchical queries
[engines.documentdb]
kind = "anti_pattern"
supported = true
catalog = "documentdb"
catalog_id = "documentdb-anti-04"
severity = 0.8
why = "Self-referential FKs or recursive queries. $graphLookup runs on DocumentDB 8.0 instance-based clusters, not on 5.0 or earlier and not on elastic clusters (Amazon DocumentDB Developer Guide, Supported MongoDB APIs, operations, and data types)."
guidance = "Use Materialized Path pattern (store ancestor path as string), or pre-flatten hierarchies at write time. Consider Neptune for true graph workloads."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.elasticache]
kind = "unscored"
supported = true
why = "ElastiCache's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.aurora_postgresql]
