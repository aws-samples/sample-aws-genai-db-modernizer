targets = ["aurora_mysql", "aurora_postgresql"]
impact = "informational"
reason = "These types are converted to the target's matching type (for example NUMBER to numeric or a native integer, VARCHAR2 to varchar, CLOB to text): check precision and range in the conversion report."
