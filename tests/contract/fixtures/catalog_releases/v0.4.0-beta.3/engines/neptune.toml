# Amazon Neptune: a future enhancement, not modelled yet (ADR-031 Decision 9, #495).
# Named so contracts, the UI and reports can talk about it; never a routing candidate, no
# analysis agent, detectors or schema-design skill. Every pattern file carries an explicit
# `kind = "future"` entry for it, so the decision is written down rather than defaulted.
# The `graph_traversal -> neptune` signal override (assignment_resolver) stays inert: a
# future engine is never selected, so that override cannot fire.
id = "neptune"
display_name = "Neptune"
display_order = 7
ui_picker_order = 5
status = "future"
role = "graph"
system_of_record = true

[colors]
ui = "#7d2105"
