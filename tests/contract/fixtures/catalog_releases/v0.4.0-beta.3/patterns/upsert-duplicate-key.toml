# Detection signals: ON DUPLICATE KEY UPDATE
[engines.aurora_mysql]
kind = "fit"
supported = true
catalog = "aurora_mysql"
catalog_id = "aurora-mysql-03"
score = 80
why = "UPSERT using INSERT ... ON DUPLICATE KEY UPDATE. Aurora MySQL handles atomic insert-or-update with row-level locking on the unique/primary key."
concerns = ["Auto-increment gaps may occur with ON DUPLICATE KEY UPDATE."]
table_bonus = 5

