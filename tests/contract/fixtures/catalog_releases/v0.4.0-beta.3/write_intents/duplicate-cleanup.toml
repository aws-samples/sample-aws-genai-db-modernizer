# Write intent duplicate-cleanup (#1362). Fields: src/shared/catalog/write_intents.py.
id = "duplicate-cleanup"
name = "Duplicate clean-up"
summary = "Removes rows that repeat another row's natural key, keeping one."

[engines.dynamodb]
approach = "Make the natural key the item's primary key (or write a uniqueness item for it in the same TransactWriteItems) and put with a ConditionExpression of attribute_not_exists, so a duplicate is never stored and nothing needs cleaning up."
docs = "Amazon DynamoDB Developer Guide, section on condition expressions"

[engines.documentdb]
approach = "Remove the existing duplicates once, then create a unique index on the natural key fields and upsert on that key, so a duplicate insert fails instead of being cleaned up later."
docs = "Amazon DocumentDB Developer Guide, Managing Amazon DocumentDB indexes"

[engines.elasticache]
approach = "Key the entry by its natural key and write it with SET NX, so writing it twice keeps one."
docs = "Valkey documentation, SET command reference"

[engines.opensearch]
approach = "Use the natural key as the document _id, so indexing the same entity again overwrites one document."
docs = "OpenSearch documentation, Index document API"

[engines.aurora_postgresql]
approach = "Remove the existing duplicates once, then add a unique constraint on the natural key and write with INSERT ... ON CONFLICT DO NOTHING, so duplicates cannot be written."
docs = "PostgreSQL documentation, INSERT (ON CONFLICT clause)"

[engines.aurora_mysql]
approach = "Remove the existing duplicates once, then add a unique index on the natural key and write with INSERT ... ON DUPLICATE KEY UPDATE, so duplicates cannot be written."
docs = "MySQL 8.0 Reference Manual, INSERT ... ON DUPLICATE KEY UPDATE Statement"
