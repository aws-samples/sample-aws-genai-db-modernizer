# Write intent retention-delete (#1362). Fields: src/shared/catalog/write_intents.py.
id = "retention-delete"
name = "Retention delete"
summary = "Removes rows once they pass an age or expiry cut-off, run on a schedule."

[engines.dynamodb]
approach = "Use Time to Live: write an epoch-seconds expiry attribute (the item's date plus the retention period) only on the items the cut-off applies to, the statement's other conditions included, remove it when those conditions stop holding, and enable TTL on it, so DynamoDB deletes expired items in the background with no write cost; TTL deletes within days, not at the second, so a read that must not see an expired item filters on the attribute, and a DynamoDB Streams consumer can archive what TTL removes."
docs = "Amazon DynamoDB Developer Guide, Using time to live (TTL) in DynamoDB"

[engines.documentdb]
approach = "Create a TTL index on a date field set only on the documents the cut-off applies to, the statement's other conditions included (a document without the field never expires), and remove the field when those conditions stop holding; DocumentDB deletes expired documents in the background, not at the exact time, and the deletes consume I/O like any write, so a read that must not see an expired document filters on the field."
docs = "Amazon DocumentDB Developer Guide, section on time to live (TTL) indexes"

[engines.elasticache]
approach = "Set the expiry when the key is written (SET with EX, or EXPIRE), so the cache drops it at the cut-off with no sweep."
docs = "Valkey documentation, EXPIRE command reference"

[engines.opensearch]
approach = "Write to time-based indexes behind a rollover alias and let an Index State Management policy delete each index once it passes the retention period, instead of deleting documents one by one."
docs = "Amazon OpenSearch Service Developer Guide, Index State Management in Amazon OpenSearch Service"

[engines.aurora_postgresql]
approach = "Keep the scheduled DELETE, in small batches over an index on the date column, or range-partition the table on that column and drop whole old partitions (the pg_partman extension can schedule it)."
docs = "Amazon Aurora User Guide, Managing PostgreSQL partitions with the pg_partman extension"

[engines.aurora_mysql]
approach = "Keep the scheduled DELETE, in small batches (DELETE ... LIMIT) over an index on the date column, or range-partition the table on that column and drop old partitions with ALTER TABLE ... DROP PARTITION."
docs = "MySQL 8.0 Reference Manual, Partitioning"
