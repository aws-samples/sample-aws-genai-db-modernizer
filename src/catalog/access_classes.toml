# Access-pattern classes (ADR-031 Decision 14, Amendment 5, #728). Fields: src/shared/catalog/access_classes.py.
#
# Every query gets exactly one class from what it retrieves (src/agents/referee/access_pattern.py).
# A class's pattern score on an engine is the highest rating the listed pattern files give that
# engine (a `fit` entry's `score`, or a `native`/`unscored` entry's `class_score`), or 0 when none
# of them rates it: the numbers stay in the pattern files (Decision 8), this file only says which
# patterns describe each class. An anti-pattern listed here (frequent-full-scan) documents why an
# engine gets 0, it never adds a score. A pattern in a class's `only_when` counts only for a query
# showing its fact (the classifier reads each from the SQL facade); a write is rated only on a
# system of record, so OpenSearch and ElastiCache are never credited for one (ADR-031 Decision 2
# step 3, #936). No class lists a write pattern (`write_pattern`). Classes are listed in
# severity order: when one statement shows several shapes, the later class wins.
#
# Routing reads these scores: a query's pattern dimension on an engine is its own class's score
# there (src/agents/referee/query_pattern.py, ADR-031 Decision 14 Amendment 5, #728).

[[classes]]
id = "key_lookup"
label = "Key lookup"
leaning = "key-value"
why = "One row, or a batch of rows, by its full primary or unique key; also a single row in primary-key order at any offset (#857), and an INSERT of values."
# batch-in-list rates the WHERE key IN (...) batch this class includes (#920); it raises no
# score today, since every engine it rates rates key-value-lookup at least as high.
patterns = ["key-value-lookup", "batch-in-list", "standard-crud"]

[[classes]]
id = "key_scoped"
label = "Key-scoped 1:N read"
leaning = "item collection"
why = "Rows addressed by a non-unique key value, or an entity and its related rows reached by key from a key predicate: one item collection, not a relational need."
patterns = ["bounded-parent-child", "co-accessed-tables", "nested-document", "extended-reference", "simple-join", "standard-crud", "range-query"]
# range-query rates DynamoDB's Query shape, a partition-key equality plus a range on another
# column of the same table (#933's shape, the maintainer's choice there): it counts only for a
# query that shows it (the classifier's partition_range fact, read from the facade's ranges).
only_when = { "range-query" = "partition_range" }

[[classes]]
id = "reference_read"
label = "Small reference-table read"
leaning = "neutral"
why = "Every row of a small table (at most 10,000 collected rows, metadata-config-store's limit) with no predicate and no row limit: reference data such as feature flags, settings or a lookup list, which every engine serves from memory once read (MySQL Reference Manual, Buffer Pool; PostgreSQL documentation, Resource Consumption; Amazon DynamoDB Developer Guide, Best practices for querying and scanning data)."
# Proposed default (#920), open to revision: the table's reference-data rating where the catalog
# has one (DynamoDB's metadata-config-store), otherwise the same index or table read the range
# class rates (pagination). Not frequent-full-scan: a read of every row returns every row it reads.
patterns = ["metadata-config-store", "pagination"]

[[classes]]
id = "key_range"
label = "Range or ordered read by key"
leaning = "neutral"
why = "A range or an order over a key with no anchoring value (BETWEEN, ORDER BY id LIMIT n, a full read with no predicate): an index range scan on a relational or document engine, a Scan on a key-value engine (no partition value)."
patterns = ["pagination", "frequent-full-scan"]

[[classes]]
id = "ad_hoc_filter"
label = "Ad hoc filter"
leaning = "relational, document or search"
why = "Filters on non-key attributes with no anchoring key (a timestamp range included), and an unkeyed bulk write."
# A read pattern rates the class; multi-row-mutation (a write) is not listed (#936).
patterns = ["secondary-attribute-filter", "standard-crud"]

[[classes]]
id = "unanchored_join"
label = "Unanchored join"
leaning = "relational"
why = "A join in which some table is not reached by key from a key predicate."
patterns = ["simple-join", "complex-join"]

[[classes]]
id = "aggregation"
label = "Aggregation"
leaning = "relational or analytics"
why = "GROUP BY with an aggregate function, an aggregate over rows no key anchors, or a windowed aggregate."
patterns = ["aggregation-analytics", "window-function", "reporting-query", "group-concat-pivot", "aggregation-pipeline", "time-aggregation"]
# time-aggregation rates date-bucket aggregations only: it counts for a query whose GROUP BY
# truncates or extracts a date/time (the facade's time_bucket fact, #920). window-function rates
# a query that has a window function, not every aggregation (#920, catalog PR C).
only_when = { "time-aggregation" = "time_bucket", "window-function" = "window_function" }

[[classes]]
id = "text_search"
label = "Text search"
leaning = "search"
why = "With no key anchoring the rows: a leading-wildcard LIKE, a regular expression, a similarity function or a full-text match."
patterns = ["full-text-search", "wildcard-search", "fuzzy-search", "regex-search", "prefix-regex"]
# Each text pattern rates only the text search it describes (#920, catalog PR C): a LIKE '%x%'
# is not rated by an engine's full-text index, which does not serve it.
only_when = { "full-text-search" = "full_text", "wildcard-search" = "leading_wildcard", "regex-search" = "pattern_match", "prefix-regex" = "prefix_regex", "fuzzy-search" = "similarity_match" }

# SQL features a query of any class can show (#985). Each feature's pattern rates the query,
# alongside its class's own patterns, only when the query shows the feature's fact (read from
# the SQL facts by the classifier), so the per-query score keeps each engine's documented
# credit for the feature (recursive CTEs: Aurora PostgreSQL 95 against Aurora MySQL 90).
[[features]]
pattern = "cte-recursive"
fact = "recursive_cte"
why = "A recursive CTE (WITH RECURSIVE, or a CTE whose body reads itself) is served by the engines that run it natively, each at its own documented rating."

[[features]]
pattern = "lateral-join"
fact = "lateral_join"
why = "A LATERAL join (a derived table that reads the row before it) is served by the engines that run it natively, each at its own documented rating."

[[features]]
pattern = "stored-routine"
fact = "stored_routine"
why = "A call to a stored procedure or function runs only where the routine lives, on an engine that runs stored routines, each at its own documented rating."

# The upsert patterns rate the upsert statement itself (#984), each on its own engine at its
# documented rating; a key read of the same table earns nothing from them (Decision 14).
[[features]]
pattern = "upsert-conflict"
fact = "upsert"
why = "An upsert (INSERT ... ON CONFLICT) is served natively by the engine whose upsert it is, at its documented rating."

[[features]]
pattern = "upsert-duplicate-key"
fact = "upsert"
why = "An upsert (INSERT ... ON DUPLICATE KEY UPDATE, REPLACE INTO) is served natively by the engine whose upsert it is, at its documented rating."

# Each Aurora engine's full-text search rates the full-text query itself, in any class
# (#984): a key-anchored MATCH ... AGAINST is credited like an unanchored one, and no other
# query on the table earns anything from it (Decision 14).
[[features]]
pattern = "full-text-native"
fact = "full_text"
why = "A full-text match (tsvector with a GIN index) is served natively by Aurora PostgreSQL, at its documented rating."

[[features]]
pattern = "fulltext-search"
fact = "full_text"
why = "A full-text match (MATCH ... AGAINST over a FULLTEXT index) is served natively by Aurora MySQL, at its documented rating."

# A JSON read rates the query that reads or builds JSON itself, in any class (#1102), on
# each engine at its documented fit (Aurora PostgreSQL and Aurora MySQL 85, DocumentDB 80);
# no other query on the table earns anything from it (Decision 14).
[[features]]
pattern = "json-document-query"
fact = "json_access"
why = "A query that reads or builds JSON (a JSON function or operator, a cast to JSON, a JSON containment) is served by the engines that index and query JSON paths, each at its own documented rating."
