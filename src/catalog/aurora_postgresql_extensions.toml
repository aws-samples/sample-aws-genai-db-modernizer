# The extensions Amazon Aurora PostgreSQL offers, per major version line, that the
# relational-move gap check (#1078) compares a PostgreSQL source's installed extensions
# (pg_extension) with. Fields: src/shared/catalog/gaps.py.
#
# Source: the public "Extension versions for Amazon Aurora PostgreSQL" page of the Aurora
# PostgreSQL release notes ("Extensions supported for Aurora PostgreSQL <line>"), read on
# retrieved_on. One [lines."<line>"] per line aurora_versions.toml lists for
# aurora_postgresql. Each extension is keyed by its pg_extension name (the page's
# pgvector is vector, PostGIS postgis, h3-pg h3, h3-postgis h3_postgis, pgAudit pgaudit,
# pg_roaringbitmap roaringbitmap, "autoinc (contrib-spi)" autoinc), and its value is the
# newest version any release of the line offers. A version is the leading dotted number
# of the page's text, as pg_extension's extversion reports it: pg_bigm "1.2_20250903" is
# 1.2, rdkit "4.6.1 (2024_09_6)" is 4.6.1. Modules the page lists that CREATE EXTENSION
# does not install (auto_explain, the ICU module) are left out. Update the lists when
# the page changes; lint warns when retrieved_on is more than 90 days old
# (scripts/check_extension_list_age.py).
source_engines = ["postgresql"]
docs = "Extension versions for Amazon Aurora PostgreSQL"
retrieved_on = "2026-11-03"

# The extensions that ship with the PostgreSQL server, by pg_extension name: the modules
# of the PostgreSQL documentation's "Additional Supplied Modules and Extensions" appendix
# (versions 14 to 18) and its procedural languages. Their version follows the server's
# major version, so the gap check compares only their name with the lists below, never
# their version: the page can list an older version than the server ships (seg 1.0 on
# 16 to 18, where PostgreSQL has shipped 1.4 since 12).
server_modules = [
  "adminpack", "amcheck", "autoinc", "bloom", "bool_plperl", "btree_gin", "btree_gist",
  "citext", "cube", "dblink", "dict_int", "dict_xsyn", "earthdistance", "file_fdw",
  "fuzzystrmatch", "hstore", "hstore_plperl", "hstore_plperlu", "hstore_plpython3u",
  "insert_username", "intagg", "intarray", "isn", "jsonb_plperl", "jsonb_plperlu",
  "jsonb_plpython3u", "lo", "ltree", "ltree_plpython3u", "moddatetime", "old_snapshot",
  "pageinspect", "pg_buffercache", "pg_freespacemap", "pg_prewarm", "pg_stat_statements",
  "pg_surgery", "pg_trgm", "pg_visibility", "pg_walinspect", "pgcrypto", "pgrowlocks",
  "pgstattuple", "plperl", "plperlu", "plpgsql", "plpython3u", "pltcl", "pltclu",
  "postgres_fdw", "refint", "seg", "sslinfo", "tablefunc", "tcn", "tsm_system_rows",
  "tsm_system_time", "unaccent", "uuid-ossp", "xml2",
]
server_modules_docs = "PostgreSQL documentation, Additional Supplied Modules and Extensions; Procedural Languages"

