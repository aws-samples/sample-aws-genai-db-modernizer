# Pattern simple-cache-read. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "simple-cache-read"
detectors = [
    "src.tools.analysis.aurora_common_analysis_tools:analyze_aurora_common_use_cases",
]
# Penalty: ElastiCache does this at microsecond latency.
penalty = 25

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; its penalty only lands on an engine whose own analysis reports it."

[engines.documentdb]
