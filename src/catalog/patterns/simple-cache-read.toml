severity = 0.7
why = "Reads of small, rarely-changing data (config, sessions, feature flags) above 21,875 calls/second, the documented read capacity of Aurora's smallest memory-optimized instance (thresholds in the Aurora engine file). Below it Aurora serves them natively from memory once read (MySQL Reference Manual, Buffer Pool; PostgreSQL documentation, Resource Consumption, shared_buffers), so a cache in front is a latency choice."
engine_hint = "ElastiCache provides microsecond latency for cached reads without database connection overhead."
guidance = "Consider ElastiCache/Redis for session stores, config caches, and frequently read reference data."
guidance_names_engine = true
better_served_by = ["elasticache"]

