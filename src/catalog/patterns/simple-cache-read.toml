# Pattern simple-cache-read. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "simple-cache-read"
name = "Simple cache read"
detectors = [
    "src.tools.analysis.aurora_common_analysis_tools:analyze_aurora_common_use_cases",
]
# Penalty: ElastiCache does this at microsecond latency.
penalty = 20
penalty_basis = "workload_fit"

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; its penalty only lands on an engine whose own analysis reports it."

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; its penalty only lands on an engine whose own analysis reports it."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; its penalty only lands on an engine whose own analysis reports it."

[engines.elasticache]
kind = "unscored"
supported = true
why = "ElastiCache's analysis does not report this pattern; its penalty only lands on an engine whose own analysis reports it."

# Detection signals: a single-table SELECT of at most 10 rows above the Aurora engine file's
# memory_read_capacity_calls_per_second (21,875, its documented source there; #1994)
[engines.aurora_postgresql]
kind = "anti_pattern"
supported = true
catalog = "aurora_common"
catalog_id = "aurora-anti-02"
severity = 0.7
why = "Reads of small, rarely-changing data (config, sessions, feature flags) above 21,875 calls/second, the documented read capacity of Aurora's smallest memory-optimized instance (thresholds in the Aurora engine file). Below it Aurora serves them natively from memory once read (MySQL Reference Manual, Buffer Pool; PostgreSQL documentation, Resource Consumption, shared_buffers), so a cache in front is a latency choice."
engine_hint = "ElastiCache provides microsecond latency for cached reads without database connection overhead."
guidance = "Consider ElastiCache/Redis for session stores, config caches, and frequently read reference data."
guidance_names_engine = true
better_served_by = ["elasticache"]

