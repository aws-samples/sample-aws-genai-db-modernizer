# Detection signals: CALL procedure, DELIMITER patterns
[engines.aurora_mysql]
kind = "fit"
supported = true
catalog = "aurora_mysql"
catalog_id = "aurora-mysql-05"
score = 70
why = "Stored procedures and functions (CALL, CREATE PROCEDURE). Aurora MySQL supports stored routines for encapsulating business logic server-side — reducing network round-trips for multi-step operations."
concerns = [
    "Stored routines increase operational complexity and are harder to version-control.",
    "Consider migrating complex logic to application layer for testability.",
]
