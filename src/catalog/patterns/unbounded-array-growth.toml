# Pattern unbounded-array-growth. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "unbounded-array-growth"
name = "Unbounded array growth"
detectors = []
penalty = 10
penalty_basis = "bounded_limit"

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection signals: parent-child FK with unbounded child growth
[engines.documentdb]
kind = "anti_pattern"
supported = true
catalog = "documentdb"
catalog_id = "documentdb-anti-02"
severity = 0.7
why = "Embedded arrays that grow without limit hit the 16 MB document size limit (Amazon DocumentDB Developer Guide, Quotas and limits)."
guidance = "Use Bucket Pattern (bounded arrays) or Reference Pattern for unbounded relationships."

