# Not a fit pattern (#920): how often a query runs (SELECT below 0.1 calls/s) is not an access pattern.
# It used to be DynamoDB's catch-all fit, matched by joins, aggregates and full scans
# alike. That on-demand capacity suits sporadic traffic is cost evidence, for the cost
# dimension (ADR-031 Decision 5, #494); the query is scored on its own access pattern.
[engines.dynamodb]
kind = "unscored"
supported = true
why = "Call rate is not an access pattern, so this is not a fit; that on-demand capacity suits sporadic traffic is cost evidence for the cost dimension (ADR-031 Decision 5, #494)."

