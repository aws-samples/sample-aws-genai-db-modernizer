detectors = [
    "src.tools.analysis.documentdb_analysis_tools:analyze_documentdb_use_cases",
]
penalty = 0

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection signals: parent_child_fk, bounded_child_rows, co_access, json_extract
[engines.documentdb]
kind = "fit"
supported = true
catalog = "documentdb"
catalog_id = "documentdb-04"
score = 85
why = "Parent-child FK relationships with bounded child cardinality suitable for embedding as nested arrays. Eliminates JOINs entirely."
concerns = [
    "Embedded arrays must stay bounded — unbounded growth hits 16MB limit",
    "Updates to embedded items rewrite the entire parent document",
]

