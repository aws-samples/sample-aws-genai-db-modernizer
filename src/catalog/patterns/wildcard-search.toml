# Pattern wildcard-search. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "wildcard-search"
detectors = [
    "src.tools.analysis.opensearch_analysis_tools:analyze_opensearch_use_cases",
]
triage_signal = "text_search"
capability = "text_search"
# Penalty: LIKE '%term%' is not DynamoDB's job.
penalty = 40
penalty_basis = "cannot_run"
exempt_note = "{engine} runs this search pattern natively: not penalized. OpenSearch is worth the move only when traffic, data size or search depth justify a dedicated search engine"

[engines.dynamodb]
kind = "penalized"
supported = false
why = "DynamoDB cannot run this pattern: a query another engine reports it for loses 40 points on DynamoDB."

[engines.documentdb]
kind = "native"
supported = true
why = "$regex expresses LIKE natively, but only a prefix regular expression without the i, m or o options uses an index, so a leading wildcard is a collection scan (Amazon DocumentDB Developer Guide, Query planner). Class score (#728): 45, a scan of every document; what the scan costs a frequent query on a large table stays substring-match's penalty (#493)."
class_score = 45

# Detection signals: like %, ilike %
[engines.opensearch]
kind = "fit"
supported = true
catalog = "opensearch"
catalog_id = "os-02"
score = 80
profile = "search"
why = "LIKE/ILIKE wildcard queries on text columns. OpenSearch wildcard queries are more scalable than SQL LIKE on large datasets, with no full-table scan."
concerns = [
    "Leading wildcard queries (LIKE '%term') are expensive in both SQL and OpenSearch.",
    "For prefix queries, consider edge-ngram tokenizer for better performance.",
]
# Wildcard or fuzzy matching: one bonus for a table showing either.
bonus_group = "approximate-match"
table_bonus = 10

[engines.elasticache]
kind = "penalized"
supported = false
why = "ElastiCache cannot run this pattern: a query another engine reports it for loses 40 points on ElastiCache."

[engines.aurora_postgresql]
kind = "native"
supported = true
why = "LIKE and ILIKE are native SQL, and a pg_trgm GIN or GiST index serves them with a leading wildcard too, an extension to create (PostgreSQL documentation, pg_trgm, Index Support; the substring-match pattern, #493). Class score (#728): 80, an index serves the match."
class_score = 80

[engines.aurora_mysql]
kind = "native"
supported = true
why = "LIKE is native SQL, but a B-tree index serves LIKE only when the pattern does not start with a wildcard and a FULLTEXT index serves only MATCH ... AGAINST, so a leading wildcard reads every row (MySQL Reference Manual, Comparison of B-Tree and Hash Indexes). Class score (#728): 45, a scan of every row; what the scan costs a frequent query on a large table stays substring-match's penalty (#493)."
class_score = 45

[engines.neptune]
kind = "future"
supported = false
why = "Not modelled yet (future enhancement)"

[engines.keyspaces]
kind = "future"
supported = false
why = "Not modelled yet (future enhancement)"
