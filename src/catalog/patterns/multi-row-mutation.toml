# Detection signals: UPDATE/DELETE with complex WHERE (not simple PK), batch operations
[engines.aurora_postgresql]
kind = "fit"
supported = true
catalog = "aurora_common"
catalog_id = "aurora-common-07"
score = 75
why = "UPDATE or DELETE operations with complex WHERE clauses affecting multiple rows. Aurora handles bulk mutations with row-level locking and MVCC, maintaining consistency without full-table locks."
concerns = [
    "Large batch mutations may benefit from chunking to avoid long lock holds.",
]

