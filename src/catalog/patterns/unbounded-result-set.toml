# Pattern unbounded-result-set. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "unbounded-result-set"
detectors = [
    "src.tools.analysis.dynamodb_analysis_tools:analyze_dynamodb_use_cases",
]
penalty = 0

# Detection signals: no_limit_clause, high_rows_returned
[engines.dynamodb]
kind = "anti_pattern"
supported = true
catalog = "dynamodb"
catalog_id = "dynamodb-ap-03"
severity = 0.2
why = "Queries returning large unbounded result sets without LIMIT. DynamoDB returns max 1MB per Query/Scan — pagination is required."
guidance = "Add pagination. DynamoDB handles this natively with LastEvaluatedKey."

