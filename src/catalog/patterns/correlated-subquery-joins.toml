# Pattern correlated-subquery-joins. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "correlated-subquery-joins"
detectors = [
    "src.tools.analysis.documentdb_analysis_tools:analyze_documentdb_use_cases",
]
penalty = 0

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection signals: correlated subqueries (SELECT in SELECT, EXISTS with correlated ref)
[engines.documentdb]
kind = "anti_pattern"
supported = true
catalog = "documentdb"
catalog_id = "documentdb-anti-08"
severity = 0.7
why = "Queries with correlated subqueries. Correlated $lookup (let/pipeline) needs DocumentDB 8.0.2+ on an instance-based cluster; otherwise pre-denormalize."
guidance = "Pre-denormalize at write time. Use Extended Reference Pattern to embed frequently co-accessed fields."

