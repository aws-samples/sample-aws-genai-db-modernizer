severity = 0.3
why = "Transactions spanning many items or tables. DynamoDB TransactWriteItems supports up to 100 items across tables, but at higher latency and cost."
guidance = "Transactions up to 100 items work well. Larger scopes need saga pattern or eventual consistency design."

