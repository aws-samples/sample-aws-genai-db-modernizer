# Pattern bounded-parent-child. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "bounded-parent-child"
detectors = [
    "src.tools.analysis.dynamodb_analysis_tools:analyze_dynamodb_use_cases",
]
penalty = 0

# Detection (#920): a key-anchored join of two tables (every table reached by key from a
# pinned one, ADR-031 Decision 14 Amendment 5), not any one-join query.
[engines.dynamodb]
kind = "fit"
supported = true
catalog = "dynamodb"
catalog_id = "dynamodb-07a"
score = 75
why = "Parent-child relationship where the cardinality can be reasoned about at design time. A partition key value's item collection has no size limit unless the table has a local secondary index (then 10 GB). The bound is domain-driven (e.g., order → items, user → addresses) (Amazon DynamoDB Developer Guide, Local secondary indexes). Large item collections may need creative sort key design for efficient range queries."
concerns = [
    "Requires access pattern analysis to determine embedding vs. item collection",
    "Large item collections need sort key design for efficient range queries",
]
# A denormalizable join: a moderate fit that needs design work (more migration effort).
bonus_group = "denormalizable-join"
table_bonus = 5
complexity_bonus = -10

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.elasticache]
kind = "unscored"
supported = true
why = "ElastiCache's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.aurora_postgresql]
kind = "unscored"
supported = true
why = "Aurora PostgreSQL's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.aurora_mysql]
kind = "unscored"
supported = true
why = "Aurora MySQL's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.neptune]
