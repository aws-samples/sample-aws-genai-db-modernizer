# Detection signals: Large result sets, date-range filters, ORDER BY + LIMIT on aggregates
[engines.aurora_postgresql]
kind = "fit"
supported = true
catalog = "aurora_common"
catalog_id = "aurora-common-05"
score = 80
why = "Reporting queries with large result sets, date-range filters, and ordered/limited aggregate results. Aurora's read replicas can offload reporting workloads without impacting transactional performance."
concerns = [
    "Very heavy reporting may benefit from a dedicated analytics engine (Redshift).",
]

