# Pattern faceted-analytics. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "faceted-analytics"
detectors = [
    "src.tools.analysis.documentdb_analysis_tools:analyze_documentdb_use_cases",
]
penalty = 0

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection signals: multi-dimensional GROUP BY / HAVING with multiple aggregation axes
[engines.documentdb]
kind = "anti_pattern"
supported = true
catalog = "documentdb"
catalog_id = "documentdb-anti-06"
severity = 0.5
why = "Multi-dimensional analytics queries. $facet needs DocumentDB 8.0.2+ on an instance-based cluster (not 5.0 or earlier, not elastic clusters)."
guidance = "Run multiple aggregation pipelines in parallel at application layer."

