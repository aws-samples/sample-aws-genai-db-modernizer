# Pattern time-series-event-log. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "time-series-event-log"
name = "Time-series event log"
detectors = [
    "src.tools.analysis.dynamodb_analysis_tools:analyze_dynamodb_use_cases",
]
triage_signal = "time_series"
penalty = 0

# Detection (#920): a statement naming a timestamp column that is either an INSERT into a
# table the workload only appends to, or a SELECT with a partition-key equality plus a range
# (an entity-anchored time range). Not any INSERT that names a timestamp.
[engines.dynamodb]
kind = "fit"
supported = true
catalog = "dynamodb"
catalog_id = "dynamodb-04"
score = 85
why = "Time-ordered data with timestamp-based range reads. Maps to DynamoDB with entity ID as partition key and timestamp as sort key. TTL for automatic expiry (Amazon DynamoDB Developer Guide, Time to Live)."
concerns = [
    "Hot partitions if all writes go to 'latest' partition; consider time-bucketing",
    "Analytics queries (GROUP BY time) better served by aggregation or export to S3",
]
table_bonus = 10

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

