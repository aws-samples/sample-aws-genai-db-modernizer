# Pattern many-to-many-junction. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "many-to-many-junction"
detectors = [
    "src.tools.analysis.dynamodb_analysis_tools:analyze_dynamodb_use_cases",
]
triage_signal = "junction_tables"
penalty = 0

# Detection (#920): a key-anchored join of three or more tables through a junction table (two
# or more foreign keys and a composite primary key, key_access.is_junction_table), not any
# query with two joins.
[engines.dynamodb]
kind = "fit"
supported = true
catalog = "dynamodb"
catalog_id = "dynamodb-07b"
score = 65
why = "Many-to-many relationship via a junction table with composite PK of two FK columns. Needs a GSI or the adjacency list pattern in DynamoDB, which takes more design work (Amazon DynamoDB Developer Guide, Best practices for managing many-to-many relationships)."
concerns = [
    "Requires GSI or adjacency list pattern for bidirectional access",
    "May need data duplication for efficient queries from both sides",
]
# A denormalizable join: a moderate fit that needs design work (more migration effort).
bonus_group = "denormalizable-join"
table_bonus = 5
complexity_bonus = -10

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

