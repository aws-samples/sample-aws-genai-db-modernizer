# Pattern json-document-query. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
#
# A query that reads or builds JSON, one fact for every engine (#967): the facade's
# json_access fact. One file with an entry per engine, merged from flexible-schema
# (DocumentDB), jsonb-operations (Aurora PostgreSQL) and json-document-query (Aurora
# MySQL); an analysis saved before #967 may still name the two old ids, which no reader
# looks up in the catalog.
id = "json-document-query"
detectors = [
    "src.tools.analysis.aurora_mysql_analysis_tools:detect_mysql_specific_features",
    "src.tools.analysis.aurora_pg_analysis_tools:detect_pg_specific_features",
    "src.tools.analysis.documentdb_analysis_tools:analyze_documentdb_use_cases",
]
triage_signal = "json_columns"
penalty = 0

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection (#967): the query reads a JSON path (the facade's json_access fact). A JSON
# column on the table alone is a schema fact, not an access pattern.
[engines.documentdb]
kind = "fit"
supported = true
catalog = "documentdb"
catalog_id = "documentdb-06"
score = 80
why = "A query that reads JSON paths (JSON_EXTRACT, ->>, JSON_VALUE): the data is already semi-structured, and each path maps to a document field."
concerns = [
    "JSON_EXTRACT at query time should be replaced by top-level fields at write time",
]
table_bonus = 8
# Schema flexibility reduces migration complexity.
complexity_feature = true

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.elasticache]
kind = "unscored"
supported = true
why = "ElastiCache's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection signals: ->>, @>, jsonb_agg, jsonb_build_object
[engines.aurora_postgresql]
kind = "fit"
supported = true
catalog = "aurora_pg"
catalog_id = "aurora-pg-03"
score = 85
why = "JSONB operations (->>, @>, jsonb_agg, jsonb_build_object) for semi-structured data within relational context. Aurora PG provides GIN-indexed JSONB queries, combining document flexibility with relational joins."
concerns = [
    "Deeply nested JSONB paths may not be indexable; consider flattening hot paths.",
]
table_bonus = 10
complexity_feature = true

# Detection signals: JSON_EXTRACT, JSON_CONTAINS, ->> operator
[engines.aurora_mysql]
kind = "fit"
supported = true
catalog = "aurora_mysql"
catalog_id = "aurora-mysql-01"
score = 85
why = "JSON document queries using JSON_EXTRACT, JSON_CONTAINS, or ->> operator. Aurora MySQL 8.0+ provides multi-valued indexes on JSON arrays and generated columns for indexing JSON paths."
concerns = [
    "JSON column indexes require generated columns or multi-valued index syntax.",
]
table_bonus = 10
complexity_feature = true

[engines.neptune]
kind = "future"
supported = false
why = "Not modelled yet (future enhancement)"

[engines.keyspaces]
kind = "future"
supported = false
why = "Not modelled yet (future enhancement)"
