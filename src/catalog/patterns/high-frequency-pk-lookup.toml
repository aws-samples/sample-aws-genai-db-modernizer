# Pattern high-frequency-pk-lookup. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "high-frequency-pk-lookup"
name = "High-frequency primary key lookup"
detectors = [
    "src.tools.analysis.aurora_common_analysis_tools:analyze_aurora_common_use_cases",
]
# Penalty basis: Aurora serves it natively; DynamoDB names it as its native access path.
penalty = 20
penalty_basis = "workload_fit"

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; its penalty only lands on an engine whose own analysis reports it."

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; its penalty only lands on an engine whose own analysis reports it."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; its penalty only lands on an engine whose own analysis reports it."

[engines.elasticache]
kind = "unscored"
supported = true
why = "ElastiCache's analysis does not report this pattern; its penalty only lands on an engine whose own analysis reports it."

# Detection signals: single-row SELECT by PK above the Aurora engine file's
# memory_read_capacity_calls_per_second (21,875, its documented source there; #1994)
[engines.aurora_postgresql]
kind = "anti_pattern"
supported = true
catalog = "aurora_common"
catalog_id = "aurora-anti-01"
severity = 0.8
why = "Single-row SELECT by primary key above 21,875 calls/second, the rate at which one query alone fills the documented read capacity of Aurora's smallest memory-optimized instance (Amazon Aurora Performance Assessment Technical Guide; thresholds in the Aurora engine file). Aurora serves it natively with a B-tree point read and scales reads with up to 15 Aurora Replicas (Amazon Aurora User Guide, Replication with Amazon Aurora)."
engine_hint = "DynamoDB provides single-digit millisecond latency for key-value lookups at any scale. Aurora adds unnecessary overhead for this access pattern."
guidance = "Migrate high-frequency PK lookups to DynamoDB for predictable single-digit-millisecond latency at scale (microseconds need DynamoDB Accelerator)."
guidance_names_engine = true
better_served_by = ["dynamodb"]

# Detection signals: single-row SELECT by PK above the Aurora engine file's
# memory_read_capacity_calls_per_second (21,875, its documented source there; #1994)
[engines.aurora_mysql]
kind = "anti_pattern"
supported = true
catalog = "aurora_common"
catalog_id = "aurora-anti-01"
severity = 0.8
why = "Single-row SELECT by primary key above 21,875 calls/second, the rate at which one query alone fills the documented read capacity of Aurora's smallest memory-optimized instance (Amazon Aurora Performance Assessment Technical Guide; thresholds in the Aurora engine file). Aurora serves it natively with a B-tree point read and scales reads with up to 15 Aurora Replicas (Amazon Aurora User Guide, Replication with Amazon Aurora)."
engine_hint = "DynamoDB provides single-digit millisecond latency for key-value lookups at any scale. Aurora adds unnecessary overhead for this access pattern."
guidance = "Migrate high-frequency PK lookups to DynamoDB for predictable single-digit-millisecond latency at scale (microseconds need DynamoDB Accelerator)."
guidance_names_engine = true
better_served_by = ["dynamodb"]

[engines.neptune]
kind = "future"
supported = false
why = "Not modelled yet (future enhancement)"

[engines.keyspaces]
kind = "future"
