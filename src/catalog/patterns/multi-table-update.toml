# Detection signals: UPDATE t1 JOIN t2 SET ... (MySQL multi-table syntax)
[engines.aurora_mysql]
kind = "fit"
supported = true
catalog = "aurora_mysql"
catalog_id = "aurora-mysql-06"
score = 80
why = "Multi-table UPDATE using MySQL's JOIN syntax (UPDATE t1 JOIN t2 SET ...). Aurora MySQL executes this atomically in a single statement — no NoSQL equivalent exists."
concerns = [
    "Large multi-table updates may hold locks for extended periods.",
]

