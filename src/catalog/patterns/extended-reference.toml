# Detection signals: joins with small reference tables (row_count < 1000) for display names
[engines.documentdb]
kind = "fit"
supported = true
catalog = "documentdb"
catalog_id = "documentdb-07"
score = 85
why = "Queries joining large transactional tables with small reference/lookup tables (country, merchant, payment_type) just to get display names. Embed the few referenced fields directly — especially valuable in DocumentDB, where every $lookup is a read-time join."
concerns = [
    "Denormalized fields must be updated when reference data changes (rare for lookups)",
]

