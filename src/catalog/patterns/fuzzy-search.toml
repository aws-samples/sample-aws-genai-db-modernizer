# Pattern fuzzy-search. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "fuzzy-search"
detectors = [
    "src.tools.analysis.opensearch_analysis_tools:analyze_opensearch_use_cases",
]
triage_signal = "text_search"
capability = "fuzzy_search"
# Penalty: pg_trgm similarity(): same reasoning as wildcard-search.
