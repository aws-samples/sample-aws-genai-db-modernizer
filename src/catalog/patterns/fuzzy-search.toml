# Pattern fuzzy-search. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "fuzzy-search"
name = "Fuzzy search"
detectors = [
    "src.tools.analysis.opensearch_analysis_tools:analyze_opensearch_use_cases",
]
triage_signal = "text_search"
capability = "fuzzy_search"
# Penalty: pg_trgm similarity(): same reasoning as wildcard-search.
penalty = 40
penalty_basis = "cannot_run"
exempt_note = "{engine} runs this search pattern natively: not penalized. OpenSearch is worth the move only when traffic, data size or search depth justify a dedicated search engine"

[engines.dynamodb]
kind = "penalized"
supported = false
why = "DynamoDB cannot run this pattern: a query another engine reports it for loses 40 points on DynamoDB."

[engines.documentdb]
kind = "penalized"
supported = false
why = "DocumentDB cannot run this pattern: a query another engine reports it for loses 40 points on DocumentDB."

# Detection signals: pg_trgm, similarity(
[engines.opensearch]
kind = "fit"
supported = true
catalog = "opensearch"
catalog_id = "os-04"
score = 85
profile = "search"
why = "Fuzzy/similarity search via pg_trgm or similarity(). OpenSearch fuzzy queries use Levenshtein distance natively, with no extension required."
concerns = [
    "Fuzzy search performance depends on fuzziness parameter tuning.",
    "Trigram-based similarity may require custom tokenizer in OpenSearch.",
]
# Wildcard or fuzzy matching: one bonus for a table showing either.
bonus_group = "approximate-match"
table_bonus = 10

[engines.elasticache]
kind = "penalized"
supported = false
why = "ElastiCache cannot run this pattern: a query another engine reports it for loses 40 points on ElastiCache."

[engines.aurora_postgresql]
kind = "native"
supported = true
why = "pg_trgm's similarity(), the % operator and the <-> distance are native once the extension is created, and a GIN or GiST trigram index serves them (PostgreSQL documentation, pg_trgm, Index Support). Class score (#728): 80, an index serves the match."
class_score = 80

[engines.aurora_mysql]
kind = "penalized"
supported = false
why = "Aurora MySQL cannot run this pattern: a query another engine reports it for loses 40 points on Aurora MySQL."

[engines.neptune]
kind = "future"
supported = false
why = "Not modelled yet (future enhancement)"

[engines.keyspaces]
kind = "future"
supported = false
why = "Not modelled yet (future enhancement)"
