# Pattern metadata-config-store. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "metadata-config-store"
name = "Metadata or configuration store"
detectors = [
    "src.tools.analysis.dynamodb_analysis_tools:analyze_dynamodb_use_cases",
]
triage_signal = "metadata_config"
penalty = 0

# Detection (#920): a keyed SELECT (key lookup or key-scoped class) with no aggregate, at most
# 10 rows and 0.1 calls/s or more, on tables of at most 10,000 rows that the workload reads
# at least 10 times as often as it writes (key_access.READ_MOSTLY_RATIO). Not any small read.
[engines.dynamodb]
kind = "fit"
supported = true
catalog = "dynamodb"
catalog_id = "dynamodb-05"
score = 90
why = "Small, rarely written reference tables read by key (feature flags, config, lookup tables): GetItem or BatchGetItem on the key, with DynamoDB Accelerator for microsecond reads at an extra node cost (Amazon DynamoDB Developer Guide, Working with items; In-memory acceleration with DAX)."
table_bonus = 10

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

