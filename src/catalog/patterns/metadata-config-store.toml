# Pattern metadata-config-store. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "metadata-config-store"
detectors = [
    "src.tools.analysis.dynamodb_analysis_tools:analyze_dynamodb_use_cases",
]
triage_signal = "metadata_config"
penalty = 0

# Detection signals: small_table, high_read_ratio, low_write_frequency, simple_pk_lookup
[engines.dynamodb]
kind = "fit"
supported = true
catalog = "dynamodb"
catalog_id = "dynamodb-05"
score = 90
why = "Small reference tables with frequent reads. Also valid for high read+write metadata stores (e.g., feature flags, config, lookup tables). DynamoDB DAX or on-demand with low RCU cost."

