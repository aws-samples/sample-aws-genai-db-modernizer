# Pattern negation-heavy-queries. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "negation-heavy-queries"
detectors = [
    "src.tools.analysis.documentdb_analysis_tools:analyze_documentdb_use_cases",
]
penalty = 0

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection signals: NOT IN, <>, !=, NOT EXISTS in WHERE clauses
[engines.documentdb]
kind = "anti_pattern"
supported = true
catalog = "documentdb"
catalog_id = "documentdb-anti-05"
severity = 0.4
why = "Queries with NOT IN, <>, !=, NOT EXISTS. These map to $ne/$nin/$nor which cause full collection scans in DocumentDB (no index usage)."
guidance = "Redesign hot query paths to use positive equality operators ($eq, $in)."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

