# Pattern referential-integrity. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "referential-integrity"
detectors = [
    "src.tools.analysis.aurora_common_analysis_tools:analyze_aurora_common_use_cases",
]
