# Detection signals: LATERAL, complex subquery in FROM
[engines.aurora_postgresql]
kind = "fit"
supported = true
catalog = "aurora_pg"
catalog_id = "aurora-pg-06"
score = 85
why = "LATERAL joins for correlated subqueries in the FROM clause. Aurora PG executes these efficiently — each row from the left side feeds the lateral subquery, enabling top-N-per-group patterns."
concerns = [
    "Large outer tables with expensive lateral subqueries may need index support.",
]

