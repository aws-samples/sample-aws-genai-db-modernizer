# Detection signals: LATERAL, complex subquery in FROM
[engines.aurora_postgresql]
kind = "fit"
supported = true
catalog = "aurora_pg"
catalog_id = "aurora-pg-06"
score = 85
why = "LATERAL joins for correlated subqueries in the FROM clause, each row from the left side feeding the lateral subquery (top-N per group); LATERAL also precedes a set-returning function call (PostgreSQL documentation, Table Expressions, LATERAL Subqueries)."
concerns = [
    "Large outer tables with expensive lateral subqueries may need index support.",
]
table_bonus = 10
complexity_feature = true

[engines.aurora_mysql]
kind = "fit"
supported = true
catalog = "aurora_mysql"
catalog_id = "aurora-mysql-09"
score = 80
why = "LATERAL derived tables for correlated subqueries in the FROM clause (top-N per group) on MySQL 8.0.14 and later, which Aurora MySQL version 3 includes; a lateral derived table is a subquery only, with join-type restrictions (MySQL Reference Manual, Lateral Derived Tables)."
concerns = [
    "Large outer tables with expensive lateral subqueries may need index support.",
]
table_bonus = 10
complexity_feature = true

