# Pattern high-ingest. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "high-ingest"
detectors = [
    "src.tools.analysis.opensearch_analysis_tools:analyze_opensearch_use_cases",
]
penalty = 0

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection signals: aggregate INSERT CPS >= 10 per table
[engines.opensearch]
kind = "fit"
supported = true
catalog = "opensearch"
catalog_id = "os-07"
score = 90
profile = "timeseries"
why = "High-throughput INSERT workload (>= 10 calls/second per table). OpenSearch bulk indexing API is designed for sustained high-ingest — auto-sharding and refresh interval tuning support this pattern."
concerns = [
    "Refresh interval tuning needed: increase to 30s–60s for high-ingest to reduce segment merge overhead.",
    "Shard sizing: aim for 10–50 GB per shard for balanced performance.",
]

