# Pattern transactional-write. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "transactional-write"
detectors = [
    "src.tools.analysis.aurora_common_analysis_tools:analyze_aurora_common_use_cases",
]
penalty = 0

# Writes only: no parity anchor borrows from it and no access class lists it (#936).
write_pattern = true

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.elasticache]
kind = "unscored"
supported = true
why = "ElastiCache's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection signals: Multi-table INSERT/UPDATE in transaction context, FK-constrained writes
[engines.aurora_postgresql]
kind = "fit"
supported = true
catalog = "aurora_common"
catalog_id = "aurora-common-03"
score = 90
why = "Multi-table write operations within transaction context with FK constraints. Aurora provides full ACID compliance with multi-statement transactions; NoSQL engines cannot replicate this without application-level coordination."
concerns = [
    "Long-running transactions may cause lock contention under high concurrency.",
]

