# Pattern key-value-lookup. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "key-value-lookup"
detectors = [
    "src.tools.analysis.dynamodb_analysis_tools:analyze_dynamodb_use_cases",
]
triage_signal = "key_value_lookups"
penalty = 0

# Detection signals: single_row_select, primary_key_equality, high_frequency, low_latency
[engines.dynamodb]
kind = "fit"
supported = true
catalog = "dynamodb"
catalog_id = "dynamodb-01"
score = 100
why = "Single-item lookups by primary key."
concerns = ["Large item sizes (>400KB) require splitting"]

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; it adds no cross-engine penalty."

