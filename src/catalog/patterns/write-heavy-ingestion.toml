# Pattern write-heavy-ingestion. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "write-heavy-ingestion"
detectors = [
    "src.tools.analysis.dynamodb_analysis_tools:analyze_dynamodb_use_cases",
]
triage_signal = "write_heavy"
penalty = 0

# Detection signals: high_write_ratio, high_insert_frequency, simple_insert_structure, auto_increment_pk
[engines.dynamodb]
kind = "fit"
supported = true
catalog = "dynamodb"
catalog_id = "dynamodb-03"
score = 85
why = "High-throughput write workloads (INSERT/UPDATE)."
concerns = [
    "Auto-increment PKs create hot partitions — need key redesign",
    "Batch writes limited to 25 items per request",
]

[engines.documentdb]
kind = "unscored"
