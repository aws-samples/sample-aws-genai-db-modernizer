# Pattern write-heavy-ingestion. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "write-heavy-ingestion"
name = "Write-heavy ingestion"
detectors = [
    "src.tools.analysis.dynamodb_analysis_tools:analyze_dynamodb_use_cases",
]
triage_signal = "write_heavy"
penalty = 0

# Detection (#920): a write at 0.5 calls/s or more whose access-pattern class is a key lookup
# or a key-scoped write (an INSERT, or an UPDATE/DELETE pinning a key). A frequent write
# alone is a call rate, not an access pattern.
# Writes only: no parity anchor borrows from it and no access class lists it (#936).
write_pattern = true

[engines.dynamodb]
kind = "fit"
supported = true
catalog = "dynamodb"
catalog_id = "dynamodb-03"
score = 85
why = "Frequent writes that address their items by key (INSERT, or UPDATE/DELETE by key): PutItem, UpdateItem and DeleteItem write one item by its primary key, and capacity scales with the table's partitions (Amazon DynamoDB Developer Guide, Working with items)."
concerns = [
    "Hot partitions come from low-cardinality or skewed partition keys, or a time bucket as partition key; sequential numeric keys are hashed and spread evenly (Amazon DynamoDB Developer Guide, Designing partition keys)",
    "Batch writes limited to 25 items per request",
]
table_bonus = 8

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

