# Pattern multi-index-joins. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "multi-index-joins"
detectors = [
    "src.tools.analysis.opensearch_analysis_tools:analyze_opensearch_use_cases",
]
penalty = 30
penalty_basis = "needs_redesign"
removed_by_redesign = "rows"

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; its penalty only lands on an engine whose own analysis reports it."

[engines.documentdb]
kind = "unscored"
supported = true
why = "DocumentDB's analysis does not report this pattern; its penalty only lands on an engine whose own analysis reports it."

# Detection signals: has_joins == True AND join_count >= 2
[engines.opensearch]
kind = "anti_pattern"
supported = true
catalog = "opensearch"
catalog_id = "os-ap-01"
severity = 0.8
why = "Queries joining multiple tables (join_count >= 2). OpenSearch has no join across indexes: nested documents and the join field type relate documents inside one index only, so the data must be denormalized into one index or joined in the application layer (OpenSearch documentation, Joining queries)."
guidance = "Denormalize into a single OpenSearch index, or handle joins in the application layer by fetching related documents separately."

