# Detection signals: has_joins == True AND join_count >= 2
[engines.opensearch]
kind = "anti_pattern"
supported = true
catalog = "opensearch"
catalog_id = "os-ap-01"
severity = 0.8
why = "Queries joining multiple tables (join_count >= 2). OpenSearch does not support cross-index joins natively — these must be denormalized into a single index or handled in the application layer."
guidance = "Denormalize into a single OpenSearch index, or handle joins in the application layer by fetching related documents separately."

