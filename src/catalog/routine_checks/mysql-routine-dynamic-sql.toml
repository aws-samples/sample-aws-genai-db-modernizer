# Routine check mysql-routine-dynamic-sql (#1936). Fields: src/shared/catalog/routine_checks.py.
# Source: MySQL 8.0 Reference Manual, Prepared Statements (PREPARE).
id = "mysql-routine-dynamic-sql"
feature = "Dynamic SQL the checks cannot read"
source_engines = ["mysql"]
targets = ["aurora_mysql"]
kinds = ["procedure", "function", "trigger", "event"]
impact = "behaves_differently"
reason = "The routine prepares and runs SQL held in a user variable, so the statement checks cannot see what it runs on the target; the string literals the routine assigns to that variable are checked, but it may hold other text at run time."
fix_hint = "Review the SQL the routine builds and run it on the target, or replace the dynamic SQL with static statements the checks can read."
docs = "MySQL 8.0 Reference Manual, Prepared Statements"

[match]
dynamic_sql = true
