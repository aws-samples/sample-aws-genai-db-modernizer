# Routine check postgresql-routine-v13-removed-settings (#2016 review). Fields: src/shared/catalog/routine_checks.py.
# Source: PostgreSQL 13 release notes, Migration to Version 13 (PostgreSQL 13 replaced wal_keep_segments with wal_keep_size).
id = "postgresql-routine-v13-removed-settings"
feature = "A setting PostgreSQL 13 removed or renamed"
source_engines = ["postgresql"]
targets = ["aurora_postgresql"]
kinds = ["function", "procedure"]
impact = "needs_rewrite"
reason = "PostgreSQL 13 replaced wal_keep_segments with wal_keep_size, so on every Aurora PostgreSQL line a routine that sets, shows or reads it fails with an unrecognized configuration parameter."
fix_hint = "Use wal_keep_size (a size, not a segment count)."
docs = "PostgreSQL 13 release notes, Migration to Version 13"

[version_change]
line = "13"

[match]
removed_settings = ["wal_keep_segments"]
