# Routine check postgresql-routine-dependency-not-moved (#1937). Fields: src/shared/catalog/routine_checks.py.
# Source: PostgreSQL documentation, CREATE FUNCTION; PostgreSQL documentation, CREATE TRIGGER.
id = "postgresql-routine-dependency-not-moved"
feature = "A routine that names a table or routine not moved in the same step"
source_engines = ["postgresql"]
targets = ["aurora_postgresql"]
kinds = ["function", "procedure", "trigger"]
impact = "blocks_move"
reason = "The routine reads, writes or calls an object that is not created on the target in the same step, so it fails when it runs (or, for a trigger, cannot be created) until that object moves too."
fix_hint = "Move the named tables and routines in the same step as this routine, or move the routine in the step that moves them."
docs = "PostgreSQL documentation, CREATE FUNCTION; PostgreSQL documentation, CREATE TRIGGER"

# Checks: each table and routine the routine names (as the checker records them) is in the
# set of objects the step moves; an unqualified name is the routine's own schema.
[match]
dependencies_moved_together = true
