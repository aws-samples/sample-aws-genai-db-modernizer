# Amazon DocumentDB. Engine-wide facts only (ADR-031 Decision 8); fields: src/shared/catalog/engines.py.
id = "documentdb"
display_name = "DocumentDB"
display_order = 2
ui_picker_order = 2
status = "active"
role = "document"
system_of_record = true

[colors]
ui = "#1d8102"
ui_badge = "green"
deck = "#00E500"

[pricing]
base_monthly = 200
extra_engine_burden_monthly = 300
max_burden_per_unique_query = 100
# Standard storage I/O price, us-east-1 (aws.amazon.com/documentdb/pricing/): a read I/O is
# one 8 KB page read from storage, so a read served from the buffer cache costs none; a
# write I/O is a 4 KB unit.
read_unit_price_per_million = 0.20
read_unit_bytes = 8192
write_unit_price_per_million = 0.20
write_unit_bytes = 4096
reads_billed_on_cache_miss_only = true
