# Amazon DynamoDB. Engine-wide facts only (ADR-031 Decision 8); fields: src/shared/catalog/engines.py.
id = "dynamodb"
display_name = "DynamoDB"
display_order = 1
ui_picker_order = 1
status = "active"
role = "key_value"
system_of_record = true

[colors]
ui = "#3184e8"
ui_badge = "blue"
deck = "#FBD332"

[pricing]
base_monthly = 0
extra_engine_burden_monthly = 300
max_burden_per_unique_query = 100
# On-demand request prices, us-east-1 (aws.amazon.com/dynamodb/pricing/on-demand/): a read
# request unit reads up to 4 KB, a write request unit writes up to 1 KB.
read_unit_price_per_million = 0.125
read_unit_bytes = 4096
write_unit_price_per_million = 0.625
write_unit_bytes = 1024
