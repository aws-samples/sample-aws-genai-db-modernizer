# Amazon Aurora MySQL-Compatible Edition.
id = "aurora_mysql"
display_name = "Aurora MySQL"
display_order = 6
ui_picker_order = 8
status = "active"
role = "relational"
system_of_record = true
# The dialect's short name in reason text.
short_name = "MySQL"
# The source engines whose own dialect this is: a homogeneous migration keeps them here (#921).
source_engines = ["mysql", "mariadb"]
# Complexity points for a table using 1, or 2 or more, of the SQL features whose pattern
# entry is a complexity_feature: more Aurora features, a closer relational fit (#921).
complexity_by_feature_count = [10, 15]

[colors]
ui = "#9c5700"

[pricing]
base_monthly = 250
extra_engine_burden_monthly = 300
max_burden_per_unique_query = 100
# Aurora I/O-Optimized bills no I/O per request, so no read or write unit price: a
# query's traffic runs on the capacity its standing cost pays for (#494).
acu_price_per_hour = 0.12
storage_price_per_gb_month = 0.10

[pricing.instance_hourly]
"db.r6g.large" = 0.22
"db.r6g.xlarge" = 0.44

# Score-dimension weights (ADR-031 Decision 5). Cost is the same 10% for every engine
# (#1002); the first profile is the engine's default.
[score_weights.default]
pattern_match = 0.40
complexity = 0.30
performance = 0.20
cost = 0.10
