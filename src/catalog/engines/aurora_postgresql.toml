# Amazon Aurora PostgreSQL-Compatible Edition.
id = "aurora_postgresql"
display_name = "Aurora PostgreSQL"
display_order = 5
ui_picker_order = 9
status = "active"
role = "relational"
system_of_record = true
# The source engines whose own dialect this is: a homogeneous migration keeps them here (#921).
source_engines = ["postgresql", "postgres"]
# Complexity points for a table using 1, or 2 or more, of the SQL features whose pattern
# entry is a complexity_feature: more Aurora features, a closer relational fit (#921).
complexity_by_feature_count = [10, 15]
# For a heterogeneous source (SQL Server, Oracle, DB2), an exact tie that no source
# feature breaks goes to Aurora PostgreSQL: a maintainer rule, a named-engine preference
# held as data (ADR-031 Decision 6 Amendment 1, 2026-10-14, #656; in the catalog since
# #1081). Which engine each source feature favours is in routing.toml.
exact_tie_preferred = true
# The dialect's short name in reason text ("PostgreSQL preferred on a tie ...").
short_name = "PostgreSQL"

[colors]
ui = "#c33d69"

[pricing]
base_monthly = 250
extra_engine_burden_monthly = 300
max_burden_per_unique_query = 100
# Priced on Aurora I/O-Optimized (#1196): no I/O charge per request, so no read or write
# unit price; a query's traffic runs on the capacity its standing cost pays for (#494).
# The ACU, storage and instance prices are the price table's (src/catalog/prices.toml).
list_prices = "aurora_postgresql.io_optimized"

# Score-dimension weights (ADR-031 Decision 5). Cost is the same 10% for every engine
# (#1002); the first profile is the engine's default.
[score_weights.default]
pattern_match = 0.40
complexity = 0.30
performance = 0.20
cost = 0.10

# Engine-analysis rate thresholds (#1994). A rate is a statement's calls over its observed
# window (#1901), so a threshold derives from the engine's documented capacity for the
# access pattern, or is aligned with the other engine's floor for the same queries;
# both Aurora engines carry the same values.
[thresholds.memory_read_capacity_calls_per_second]
value = 21875.0
why = "Rate at which one query alone fills the documented read capacity of the smallest instance: Aurora MySQL's documented figure, the same for both Aurora engines until a measurement of Aurora PostgreSQL replaces it (#936): the Amazon Aurora Performance Assessment Technical Guide (AWS, June 2019) measured close to 700,000 SELECTs per second on one Aurora MySQL db.r4.16xlarge instance (64 vCPUs, sysbench read-only); scaled by vCPUs to db.r6g.large (2 vCPUs), the smallest memory-optimized class the price table lists, that is 700,000 x 2 / 64 = 21,875. Below it a primary-key point read or a small rarely-changing read is served from the buffer pool, so high-frequency-pk-lookup and simple-cache-read flag only queries above it."

[thresholds.high_volume_text_search_min_calls_per_second]
value = 10.0
why = "Combined text-search calls/s on a table above which high-volume-text-search points it at OpenSearch. Aligned, not derived: it is OpenSearch's own floor when the source's text index already serves the pattern (native_override_min_calls_per_second in opensearch.toml, #326), so the two analyses agree on the same queries; no documented capacity backs the figure."
