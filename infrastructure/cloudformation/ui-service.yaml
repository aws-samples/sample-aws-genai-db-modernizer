AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  UI Service Stack - ECS Fargate service for the Database Modernizer Assessment React
  application. Shares the API stack's ALB with path-based routing (/* default).

Parameters:
  Environment:
    Type: String
    Description: Environment name (e.g., dev, staging, prod)
    Default: dev
    MaxLength: 20
    AllowedPattern: '^[a-z][a-z0-9-]*$'

  ProjectName:
    Type: String
    Description: Project identifier for resource naming
    Default: db-modernizer

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID from core infrastructure stack

  PrivateAppSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: Private application subnet 1 ID for ECS tasks

  PrivateAppSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Private application subnet 2 ID for ECS tasks

  ContainerImage:
    Type: String
    Description: ECR image URI for the UI container

  DesiredCount:
    Type: Number
    Description: Number of ECS tasks to run
    Default: 1
    MinValue: 1
    MaxValue: 10

  ContainerPort:
    Type: Number
    Description: Port the container listens on
    Default: 8080

  EcsClusterArn:
    Type: String
    Description: ECS cluster ARN from ecs-infrastructure stack

  EcsSecurityGroupId:
    Type: String
    Description: ECS security group ID from ecs-infrastructure stack

  TaskExecutionRoleArn:
    Type: String
    Description: ECS task execution role ARN from ecs-infrastructure stack

  AlbListenerArn:
    Type: String
    Description: ALB HTTPS listener ARN from api-service stack

  AlbSecurityGroupId:
    Type: String
    Description: ALB security group ID from api-service stack

  UserPoolArn:
    Type: String
    Description: Cognito User Pool ARN from authentication stack

  UserPoolClientId:
    Type: String
    Description: Cognito User Pool App Client ID from authentication stack

  UserPoolDomain:
    Type: String
    Description: Cognito User Pool domain

  KmsKeyArn:
    Type: String
    Description: KMS key ARN for log encryption (optional)
    Default: ''

Conditions:
  HasKmsKey: !Not [!Equals [!Ref KmsKeyArn, '']]

Resources:
  # ============================================================
  # ALB → ECS Security Group Ingress (UI port)
  # ============================================================
  UiEcsIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroupId
      Description: Allow traffic from ALB to UI container port

  UiAlbEgressToEcs:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      DestinationSecurityGroupId: !Ref EcsSecurityGroupId
      Description: Allow ALB to reach UI ECS tasks on container port

  # ============================================================
  # CloudWatch Log Group
  # ============================================================
  UiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-${Environment}-ui'
      RetentionInDays: 30
      KmsKeyId: !If [HasKmsKey, !Ref KmsKeyArn, !Ref 'AWS::NoValue']
      Tags:
        - Key: Project
          Value: Database Modernizer Assessment
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================
  # Target Group
  # ============================================================
  UiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Project
          Value: Database Modernizer Assessment
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================
  # Listener Rule — catch-all for UI (lowest priority)
  # API paths (/api/*, /health) are handled by higher-priority
  # rules in the api-service stack.
  # ============================================================
  UiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbListenerArn
      Priority: 50000
      Conditions:
        - Field: path-pattern
          Values:
            - /*
      Actions:
        - Type: authenticate-cognito
          Order: 1
          AuthenticateCognitoConfig:
            UserPoolArn: !Ref UserPoolArn
            UserPoolClientId: !Ref UserPoolClientId
            UserPoolDomain: !Ref UserPoolDomain
            OnUnauthenticatedRequest: authenticate
            Scope: openid email profile
            SessionTimeout: 3600
        - Type: forward
          Order: 2
          TargetGroupArn: !Ref UiTargetGroup

  # ============================================================
  # ECS Task Definition
  # ============================================================
  UiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${Environment}-ui'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      ContainerDefinitions:
        - Name: ui
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref UiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ui
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref Environment
      Tags:
        - Key: Project
          Value: Database Modernizer Assessment
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================
  # ECS Service
  # ============================================================
  UiService:
    Type: AWS::ECS::Service
    DependsOn: UiListenerRule
    Properties:
      ServiceName: !Sub '${ProjectName}-${Environment}-ui-service'
      Cluster: !Ref EcsClusterArn
      TaskDefinition: !Ref UiTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref EcsSecurityGroupId
          Subnets:
            - !Ref PrivateAppSubnet1Id
            - !Ref PrivateAppSubnet2Id
      LoadBalancers:
        - ContainerName: ui
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref UiTargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      Tags:
        - Key: Project
          Value: Database Modernizer Assessment
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

# ============================================================
# Outputs
# ============================================================
Outputs:
  ServiceName:
    Description: ECS service name
    Value: !GetAtt UiService.Name
    Export:
      Name: !Sub '${AWS::StackName}-ServiceName'

  LogGroupName:
    Description: CloudWatch log group name for UI ECS tasks
    Value: !Ref UiLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LogGroupName'
