AWSTemplateFormatVersion: '2010-09-09'
Description: |
  OPTIONAL — Example CI/CD IAM Role for Database Modernizer Assessment Project.
  This template is a reference implementation using GitHub Actions OIDC.
  Adapt the trust policy to your own CI/CD system (CodePipeline, Jenkins,
  GitLab, etc.) or deploy the other stacks manually via AWS CLI.

  DEPLOYMENT:
  aws cloudformation deploy \
    --template-file infrastructure/cloudformation/example-ci-runner-iam.yaml \
    --stack-name modernizer-ci-runner-iam \
    --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organization or user name
    Default: your-org

  GitHubRepo:
    Type: String
    Description: GitHub repository name
    Default: aws-genai-db-modernizer

  GitHubBranch:
    Type: String
    Description: Branch allowed to assume this role (use * for any branch)
    Default: main

  ProjectPrefix:
    Type: String
    Description: Prefix for resource names (must match STACK_NAME_PREFIX in deploy workflow)
    Default: modernizer
    AllowedPattern: '^[a-z][a-z0-9-]*$'

Resources:
  # ============================================================
  # GitHub Actions OIDC Provider (create once per account)
  # ============================================================
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
      Tags:
        - Key: Project
          Value: Database Modernizer Assessment
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================
  # CI Runner IAM Role
  # ============================================================
  CIRunnerRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name for cross-account reference and protection"
    Properties:
      RoleName: !Sub '${ProjectPrefix}-ci-runner-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      Tags:
        - Key: Project
          Value: Database Modernizer Assessment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: GitHub Actions CI/CD

  # ============================================================
  # Policy 1: CloudFormation and S3
  # ============================================================
  CloudFormationS3Policy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "CloudFormation requires * for ValidateTemplate and ListStacks"
          - id: W28
            reason: "Explicit name for auditability"
    Properties:
      ManagedPolicyName: !Sub '${ProjectPrefix}-runner-cfn-s3'
      Description: CloudFormation and S3 permissions for CI runner
      Roles:
        - !Ref CIRunnerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFormationStacks
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:TagResource
            Resource:
              - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectPrefix}-*'
          - Sid: CloudFormationGlobal
            Effect: Allow
            Action:
              - cloudformation:ListStacks
              - cloudformation:ValidateTemplate
            Resource: '*'
          - Sid: S3Buckets
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:GetBucket*
              - s3:PutBucket*
              - s3:DeleteBucketPolicy
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:GetLifecycleConfiguration
              - s3:PutLifecycleConfiguration
              - s3:GetEncryptionConfiguration
              - s3:PutEncryptionConfiguration
            Resource:
              - !Sub 'arn:aws:s3:::${ProjectPrefix}-*'
              - !Sub 'arn:aws:s3:::${ProjectPrefix}-*/*'

  # ============================================================
  # Policy 2: ECS and ECR
  # ============================================================
  EcsEcrPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "ECR GetAuthorizationToken and ECS task definitions require * resource"
          - id: W28
            reason: "Explicit name for auditability"
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ECR/ECS task definition operations require * resource"
    Properties:
      ManagedPolicyName: !Sub '${ProjectPrefix}-runner-ecs-ecr'
      Description: ECS and ECR permissions for CI runner
      Roles:
        - !Ref CIRunnerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ECSCluster
            Effect: Allow
            Action:
              - ecs:CreateCluster
              - ecs:DeleteCluster
              - ecs:DescribeClusters
              - ecs:UpdateCluster
              - ecs:UpdateClusterSettings
              - ecs:PutClusterCapacityProviders
              - ecs:TagResource
              - ecs:UntagResource
              - ecs:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ProjectPrefix}-*'
          - Sid: ECSService
            Effect: Allow
            Action:
              - ecs:CreateService
              - ecs:UpdateService
              - ecs:DeleteService
              - ecs:DescribeServices
              - ecs:ListTasks
              - ecs:DescribeTasks
              - ecs:StopTask
              - ecs:ListContainerInstances
              - ecs:TagResource
              - ecs:UntagResource
              - ecs:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectPrefix}-*/*'
              - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/${ProjectPrefix}-*/*'
              - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:container-instance/${ProjectPrefix}-*/*'
          - Sid: ECSTaskDef
            Effect: Allow
            Action:
              - ecs:RegisterTaskDefinition
              - ecs:DeregisterTaskDefinition
              - ecs:DescribeTaskDefinition
              - ecs:ListTaskDefinitions
              - ecs:TagResource
              - ecs:UntagResource
            Resource: '*'
          - Sid: ECRRepo
            Effect: Allow
            Action:
              - ecr:CreateRepository
              - ecr:DeleteRepository
              - ecr:DescribeRepositories
              - ecr:GetRepositoryPolicy
              - ecr:SetRepositoryPolicy
              - ecr:DeleteRepositoryPolicy
              - ecr:PutLifecyclePolicy
              - ecr:GetLifecyclePolicy
              - ecr:PutImageScanningConfiguration
              - ecr:PutImageTagMutability
              - ecr:TagResource
              - ecr:UntagResource
              - ecr:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectPrefix}-*'
          - Sid: ECRImage
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchDeleteImage
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:ListImages
              - ecr:DescribeImages
            Resource: '*'
          - Sid: AppRunner
            Effect: Allow
            Action:
              - apprunner:CreateService
              - apprunner:UpdateService
              - apprunner:DeleteService
              - apprunner:DescribeService
              - apprunner:ListServices
              - apprunner:CreateAutoScalingConfiguration
              - apprunner:DeleteAutoScalingConfiguration
              - apprunner:DescribeAutoScalingConfiguration
              - apprunner:ListAutoScalingConfigurations
              - apprunner:TagResource
              - apprunner:UntagResource
              - apprunner:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:apprunner:${AWS::Region}:${AWS::AccountId}:service/${ProjectPrefix}-*'
              - !Sub 'arn:aws:apprunner:${AWS::Region}:${AWS::AccountId}:autoscalingconfiguration/*'
              - !Sub 'arn:aws:apprunner:${AWS::Region}:${AWS::AccountId}:autoscalingconfiguration/${ProjectPrefix}-*'

  # ============================================================
  # Policy 3: IAM Role Management
  # ============================================================
  IamPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name for auditability"
    Properties:
      ManagedPolicyName: !Sub '${ProjectPrefix}-runner-iam'
      Description: IAM permissions for CI runner
      Roles:
        - !Ref CIRunnerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: IAMRoles
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:ListRoleTags
              - iam:PutRolePolicy
              - iam:GetRolePolicy
              - iam:DeleteRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectPrefix}-*'
          - Sid: IAMPolicies
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:ListPolicyVersions
              - iam:ListEntitiesForPolicy
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/${ProjectPrefix}-*'
          - Sid: IAMPassRole
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectPrefix}-*'
          - Sid: ServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/*'
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - ecs.amazonaws.com
                  - elasticloadbalancing.amazonaws.com

  # ============================================================
  # Policy 4: Supporting Services
  # ============================================================
  SupportingServicesPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "ELB Describe and manage operations require * resource"
          - id: W28
            reason: "Explicit name for auditability"
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ELB operations require * resource"
    Properties:
      ManagedPolicyName: !Sub '${ProjectPrefix}-runner-services'
      Description: DynamoDB, CloudWatch, EventBridge, Secrets, ELB permissions
      Roles:
        - !Ref CIRunnerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DynamoDB
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:DescribeTable
              - dynamodb:UpdateTable
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:ListTagsOfResource
              - dynamodb:DescribeContinuousBackups
              - dynamodb:UpdateContinuousBackups
              - dynamodb:DescribeTimeToLive
              - dynamodb:UpdateTimeToLive
            Resource:
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectPrefix}-*'
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:TagLogGroup
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
              - logs:ListTagsLogGroup
              - logs:AssociateKmsKey
              - logs:DisassociateKmsKey
            Resource:
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${ProjectPrefix}-*'
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${ProjectPrefix}-*:*'
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/vpc/${ProjectPrefix}-*'
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/vpc/${ProjectPrefix}-*:*'
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/stepfunctions/${ProjectPrefix}-*'
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/stepfunctions/${ProjectPrefix}-*:*'
          - Sid: CloudWatchLogsDescribe
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
            Resource: '*'
          - Sid: StepFunctions
            Effect: Allow
            Action:
              - states:CreateStateMachine
              - states:DeleteStateMachine
              - states:DescribeStateMachine
              - states:UpdateStateMachine
              - states:ListStateMachines
              - states:TagResource
              - states:UntagResource
              - states:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectPrefix}-*'
          - Sid: StepFunctionsExecution
            Effect: Allow
            Action:
              - states:StartExecution
              - states:DescribeExecution
              - states:ListExecutions
              - states:GetExecutionHistory
            Resource:
              - !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectPrefix}-*'
              - !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${ProjectPrefix}-*:*'
          - Sid: LambdaFunctions
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:ListTags
            Resource:
              - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectPrefix}-*'
          - Sid: EventBridge
            Effect: Allow
            Action:
              - events:PutRule
              - events:DeleteRule
              - events:DescribeRule
              - events:ListRules
              - events:PutTargets
              - events:RemoveTargets
              - events:ListTargetsByRule
              - events:TagResource
              - events:UntagResource
              - events:ListTagsForResource
              - events:CreateEventBus
              - events:DeleteEventBus
              - events:DescribeEventBus
              - events:ListEventBuses
            Resource:
              - !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${ProjectPrefix}-*'
              - !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${ProjectPrefix}-*'
          - Sid: SecretsManager  # pragma: allowlist secret
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret  # pragma: allowlist secret
              - secretsmanager:DeleteSecret  # pragma: allowlist secret
              - secretsmanager:DescribeSecret  # pragma: allowlist secret
              - secretsmanager:UpdateSecret  # pragma: allowlist secret
              - secretsmanager:TagResource  # pragma: allowlist secret
              - secretsmanager:UntagResource  # pragma: allowlist secret
            Resource:
              - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectPrefix}/*'
          - Sid: ELBDescribe
            Effect: Allow
            Action:
              - elasticloadbalancing:Describe*
            Resource: '*'
          - Sid: ELBManage
            Effect: Allow
            Action:
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:CreateRule
              - elasticloadbalancing:DeleteRule
              - elasticloadbalancing:ModifyRule
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:ModifyTargetGroupAttributes
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:RemoveTags
              - elasticloadbalancing:SetSecurityGroups
              - elasticloadbalancing:DeregisterTargets
              - elasticloadbalancing:RegisterTargets
            Resource: '*'

  # ============================================================
  # Policy 5: KMS and Cognito
  # ============================================================
  KmsCognitoPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "KMS CreateKey and alias operations require * resource"
          - id: W28
            reason: "Explicit name for auditability"
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "KMS CreateKey requires * resource - key ARN unknown at creation time"
          - id: CKV_AWS_109
            comment: "KMS PutKeyPolicy requires * resource - key ARN unknown at creation time"
    Properties:
      ManagedPolicyName: !Sub '${ProjectPrefix}-runner-kms-cognito'
      Description: KMS and Cognito permissions for CI runner
      Roles:
        - !Ref CIRunnerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: KMSKeys
            Effect: Allow
            Action:
              - kms:CreateKey
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:PutKeyPolicy
              - kms:EnableKeyRotation
              - kms:GetKeyRotationStatus
              - kms:ScheduleKeyDeletion
              - kms:TagResource
              - kms:UntagResource
              - kms:ListResourceTags
              - kms:CreateAlias
              - kms:DeleteAlias
              - kms:UpdateAlias
              - kms:ListAliases
              - kms:CreateGrant
              - kms:ListGrants
              - kms:RevokeGrant
              - kms:RetireGrant
              - kms:Encrypt
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
            Resource: '*'
          - Sid: Cognito
            Effect: Allow
            Action:
              - cognito-idp:CreateUserPool
              - cognito-idp:DeleteUserPool
              - cognito-idp:DescribeUserPool
              - cognito-idp:UpdateUserPool
              - cognito-idp:SetUserPoolMfaConfig
              - cognito-idp:GetUserPoolMfaConfig
              - cognito-idp:CreateUserPoolClient
              - cognito-idp:DeleteUserPoolClient
              - cognito-idp:DescribeUserPoolClient
              - cognito-idp:UpdateUserPoolClient
              - cognito-idp:CreateUserPoolDomain
              - cognito-idp:DeleteUserPoolDomain
              - cognito-idp:DescribeUserPoolDomain
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminDeleteUser
              - cognito-idp:AdminGetUser
              - cognito-idp:TagResource
              - cognito-idp:UntagResource
              - cognito-idp:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  # ============================================================
  # Policy 6: VPC and Networking
  # ============================================================
  NetworkingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "EC2/VPC operations require * resource for creation"
          - id: W28
            reason: "Explicit name for auditability"
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "VPC/EC2 operations require * resource"
    Properties:
      ManagedPolicyName: !Sub '${ProjectPrefix}-runner-networking'
      Description: VPC and networking permissions for CI runner
      Roles:
        - !Ref CIRunnerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: VPCNetworking
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:DescribeVpcs
              - ec2:ModifyVpcAttribute
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:DescribeSubnets
              - ec2:CreateInternetGateway
              - ec2:DeleteInternetGateway
              - ec2:DescribeInternetGateways
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:CreateNatGateway
              - ec2:DeleteNatGateway
              - ec2:DescribeNatGateways
              - ec2:AllocateAddress
              - ec2:ReleaseAddress
              - ec2:DescribeAddresses
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:DescribeRouteTables
              - ec2:CreateRoute
              - ec2:DeleteRoute
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:DescribeSecurityGroups
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupEgress
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:DescribeTags
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeAccountAttributes
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSecurityGroupRules
              - ec2:DescribePrefixLists
              - ec2:CreateVpcEndpoint
              - ec2:DeleteVpcEndpoints
              - ec2:DescribeVpcEndpoints
              - ec2:ModifyVpcEndpoint
              - ec2:CreateFlowLogs
              - ec2:DeleteFlowLogs
              - ec2:DescribeFlowLogs
              - ec2:GetSecurityGroupsForVpc
            Resource: '*'

  # ============================================================
  # Policy 7: Route 53 and ACM
  # ============================================================
  Route53AcmPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "ACM RequestCertificate and Route53 hosted zone creation require * resource"
          - id: W28
            reason: "Explicit name for auditability"
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ACM and Route53 operations require * resource - ARNs unknown at creation time"
    Properties:
      ManagedPolicyName: !Sub '${ProjectPrefix}-runner-route53-acm'
      Description: Route 53 and ACM permissions for CI runner
      Roles:
        - !Ref CIRunnerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Route53HostedZones
            Effect: Allow
            Action:
              - route53:CreateHostedZone
              - route53:DeleteHostedZone
              - route53:GetHostedZone
              - route53:ListHostedZones
              - route53:ListHostedZonesByName
              - route53:UpdateHostedZoneComment
              - route53:GetHostedZoneCount
              - route53:ListTagsForResource
              - route53:ChangeTagsForResource
              - route53:ListQueryLoggingConfigs
            Resource: '*'
          - Sid: Route53Records
            Effect: Allow
            Action:
              - route53:ChangeResourceRecordSets
              - route53:ListResourceRecordSets
              - route53:GetChange
            Resource:
              - 'arn:aws:route53:::hostedzone/*'
              - 'arn:aws:route53:::change/*'
          - Sid: ACMCertificates
            Effect: Allow
            Action:
              - acm:RequestCertificate
              - acm:DeleteCertificate
              - acm:DescribeCertificate
              - acm:ListCertificates
              - acm:GetCertificate
              - acm:AddTagsToCertificate
              - acm:RemoveTagsFromCertificate
              - acm:ListTagsForCertificate
            Resource: '*'


# ============================================================
# Outputs
# ============================================================
Outputs:
  CIRunnerRoleArn:
    Description: CI runner role ARN (use in GitHub Actions workflow)
    Value: !GetAtt CIRunnerRole.Arn

  CIRunnerRoleName:
    Description: CI runner role name
    Value: !Ref CIRunnerRole

  OIDCProviderArn:
    Description: GitHub OIDC provider ARN
    Value: !Ref GitHubOIDCProvider
