AWSTemplateFormatVersion: '2010-09-09'
Description: Debezium MySQL source connector on Amazon MSK Connect for job wordpress-example, wave 2 (#1412).
  Generated by scripts/render_debezium_connector.py from the wave's data movement plan; regenerate it
  rather than editing it. Deploy the debezium-plugin-bucket stack first and upload the plugin ZIP (see
  the README next to it).
Parameters:
  ConnectorName:
    Type: String
    Description: MSK Connect connector name (unique in the account and region)
    Default: debezium-wordpress-wave-2
    AllowedPattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
  MskClusterArn:
    Type: String
    Description: ARN of the MSK cluster (IAM access control on) that holds the topics
    AllowedPattern: ^arn:aws[a-z-]*:kafka:[a-z0-9-]+:[0-9]{12}:cluster/[^/]+/[^/]+$
  BootstrapServers:
    Type: String
    Description: The cluster's IAM bootstrap brokers (host:9098,host:9098,...)
    AllowedPattern: ^[A-Za-z0-9.-]+:[0-9]+(,[A-Za-z0-9.-]+:[0-9]+)*$
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets the connector runs in (reach the cluster, the database and Secrets Manager)
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security groups for the connector's network interfaces
  DatabaseHost:
    Type: String
    Description: Source database writer endpoint host name
    AllowedPattern: ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$
  DatabasePort:
    Type: Number
    Description: Source database port
    Default: 3306
    MinValue: 1
    MaxValue: 65535
  DatabaseSslMode:
    Type: String
    Description: 'TLS mode to the database: encrypted, server certificate not verified yet (#1421, see
      the README)'
    Default: required
    AllowedValues:
    - required
  DatabaseSecretArn:
    Type: String
    Description: Full ARN of the Secrets Manager secret with the replication user's username and password
      keys (the role may read only this secret)
    AllowedPattern: ^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$
  SecretKmsKeyArn:
    Type: String
    Description: Customer managed KMS key ARN that encrypts the secret (empty when the secret uses the
      AWS managed key)
    Default: ''
    AllowedPattern: ^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$
  DatabaseServerId:
    Type: Number
    Description: Binlog client server id, unique among the source's replicas
    MinValue: 1
    MaxValue: 4294967295
  PluginBucketStackName:
    Type: String
    Description: Name of the debezium-plugin-bucket stack in this account and region (its PluginBucketArn
      export is imported, so the bucket is that stack's)
    AllowedPattern: ^[A-Za-z][A-Za-z0-9-]{0,127}$
  PluginFileKey:
    Type: String
    Description: Object key of the plugin ZIP (Debezium connector plus the MSK config providers)
    AllowedPattern: ^[A-Za-z0-9!_.*'()/-]{1,1024}\.zip$
  PluginObjectVersion:
    Type: String
    Description: S3 version id of the uploaded plugin ZIP (pins the exact file)
    MinLength: 1
  KafkaConnectVersion:
    Type: String
    Description: MSK Connect Kafka Connect version
    Default: 3.7.x
    AllowedValues:
    - 3.7.x
    - 2.7.1
  McuCount:
    Type: Number
    Description: MSK Connect units for the single worker
    Default: 1
    AllowedValues:
    - 1
    - 2
    - 4
    - 8
  TopicReplicationFactor:
    Type: Number
    Description: Replication factor of the topics the connector creates
    Default: 3
    MinValue: 1
    MaxValue: 5
  LogRetentionDays:
    Type: Number
    Description: Days to keep worker logs
    Default: 30
    AllowedValues:
    - 7
    - 14
    - 30
    - 60
    - 90
    - 180
    - 365
Conditions:
  HasSecretKmsKey:
    Fn::Not:
    - Fn::Equals:
      - Ref: SecretKmsKeyArn
      - ''
Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W76
          reason: One statement per resource scope (cluster, change topics, Connect internal topics, groups,
            secret); every action is listed and every resource is scoped, which is what raises the complexity
            score
    Properties:
      Description: MSK Connect service execution role for one Debezium connector
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: kafkaconnect.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:kafkaconnect:${AWS::Region}:${AWS::AccountId}:connector/${ConnectorName}/*
      Policies:
      - PolicyName: debezium-connector
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: ConnectToCluster
            Effect: Allow
            Action:
            - kafka-cluster:Connect
            - kafka-cluster:DescribeCluster
            - kafka-cluster:DescribeClusterDynamicConfiguration
            - kafka-cluster:WriteDataIdempotently
            Resource:
              Ref: MskClusterArn
          - Sid: WriteChangeTopics
            Effect: Allow
            Action:
            - kafka-cluster:CreateTopic
            - kafka-cluster:DescribeTopic
            - kafka-cluster:WriteData
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:topic/${ClusterName}/${ClusterUuid}/wordpress.*
              - ClusterName:
                  Fn::Select:
                  - 1
                  - Fn::Split:
                    - /
                    - Ref: MskClusterArn
                ClusterUuid:
                  Fn::Select:
                  - 2
                  - Fn::Split:
                    - /
                    - Ref: MskClusterArn
            - Fn::Sub:
              - arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:topic/${ClusterName}/${ClusterUuid}/__debezium-heartbeat.wave-2.wordpress
              - ClusterName:
                  Fn::Select:
                  - 1
                  - Fn::Split:
                    - /
                    - Ref: MskClusterArn
                ClusterUuid:
                  Fn::Select:
                  - 2
                  - Fn::Split:
                    - /
                    - Ref: MskClusterArn
          - Sid: ConnectInternalTopics
            Effect: Allow
            Action:
            - kafka-cluster:CreateTopic
            - kafka-cluster:DescribeTopic
            - kafka-cluster:WriteData
            - kafka-cluster:ReadData
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:topic/${ClusterName}/${ClusterUuid}/__amazon_msk_connect_*
              - ClusterName:
                  Fn::Select:
                  - 1
                  - Fn::Split:
                    - /
                    - Ref: MskClusterArn
                ClusterUuid:
                  Fn::Select:
                  - 2
                  - Fn::Split:
                    - /
                    - Ref: MskClusterArn
          - Sid: ReadSchemaHistory
            Effect: Allow
            Action:
            - kafka-cluster:ReadData
            - kafka-cluster:DescribeTopicDynamicConfiguration
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:topic/${ClusterName}/${ClusterUuid}/wordpress.schema-history.wave-2
              - ClusterName:
                  Fn::Select:
                  - 1
                  - Fn::Split:
                    - /
                    - Ref: MskClusterArn
                ClusterUuid:
                  Fn::Select:
                  - 2
                  - Fn::Split:
                    - /
                    - Ref: MskClusterArn
          - Sid: ConsumerGroups
            Effect: Allow
            Action:
            - kafka-cluster:AlterGroup
            - kafka-cluster:DescribeGroup
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:group/${ClusterName}/${ClusterUuid}/__amazon_msk_connect_*
              - ClusterName:
                  Fn::Select:
                  - 1
                  - Fn::Split:
                    - /
                    - Ref: MskClusterArn
                ClusterUuid:
                  Fn::Select:
                  - 2
                  - Fn::Split:
                    - /
                    - Ref: MskClusterArn
            - Fn::Sub:
              - arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:group/${ClusterName}/${ClusterUuid}/wordpress-wave-2-schemahistory
              - ClusterName:
                  Fn::Select:
                  - 1
                  - Fn::Split:
                    - /
                    - Ref: MskClusterArn
                ClusterUuid:
                  Fn::Select:
                  - 2
                  - Fn::Split:
                    - /
                    - Ref: MskClusterArn
          - Sid: ReadDatabaseSecret
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:DescribeSecret
            Resource:
              Ref: DatabaseSecretArn
          - Fn::If:
            - HasSecretKmsKey
            - Sid: DecryptDatabaseSecret
              Effect: Allow
              Action: kms:Decrypt
              Resource:
                Ref: SecretKmsKeyArn
              Condition:
                StringEquals:
                  kms:ViaService:
                    Fn::Sub: secretsmanager.${AWS::Region}.amazonaws.com
            - Ref: AWS::NoValue
      Tags:
      - Key: modernizer:job-id
        Value: wordpress-example
      - Key: modernizer:wave
        Value: '2'
  LogKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: Encrypts the connector's worker logs
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
        - Sid: AccountAdministers
          Effect: Allow
          Principal:
            AWS:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
          Action: kms:*
          Resource: '*'
        - Sid: LogsEncryptThisLogGroup
          Effect: Allow
          Principal:
            Service:
              Fn::Sub: logs.${AWS::Region}.amazonaws.com
          Action:
          - kms:Encrypt*
          - kms:Decrypt*
          - kms:ReEncrypt*
          - kms:GenerateDataKey*
          - kms:Describe*
          Resource: '*'
          Condition:
            ArnEquals:
              kms:EncryptionContext:aws:logs:arn:
                Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/msk-connect/${ConnectorName}
      Tags:
      - Key: modernizer:job-id
        Value: wordpress-example
      - Key: modernizer:wave
        Value: '2'
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName:
        Fn::Sub: /aws/msk-connect/${ConnectorName}
      RetentionInDays:
        Ref: LogRetentionDays
      KmsKeyId:
        Fn::GetAtt:
        - LogKey
        - Arn
      Tags:
      - Key: modernizer:job-id
        Value: wordpress-example
      - Key: modernizer:wave
        Value: '2'
  Plugin:
    Type: AWS::KafkaConnect::CustomPlugin
    Properties:
      Name:
        Fn::Sub: ${ConnectorName}-plugin
      Description: Debezium MySQL connector and the MSK config providers
      ContentType: ZIP
      Location:
        S3Location:
          BucketArn:
            Fn::ImportValue:
              Fn::Sub: ${PluginBucketStackName}-PluginBucketArn
          FileKey:
            Ref: PluginFileKey
          ObjectVersion:
            Ref: PluginObjectVersion
      Tags:
      - Key: modernizer:job-id
        Value: wordpress-example
      - Key: modernizer:wave
        Value: '2'
  WorkerConfiguration:
    Type: AWS::KafkaConnect::WorkerConfiguration
    Properties:
      Name:
        Fn::Sub: ${ConnectorName}-worker
      Description: JSON converters and the Secrets Manager config provider
      PropertiesFileContent:
        Fn::Base64:
          Fn::Sub: |
            key.converter=org.apache.kafka.connect.json.JsonConverter
            value.converter=org.apache.kafka.connect.json.JsonConverter
            config.providers=secretsmanager
            config.providers.secretsmanager.class=com.amazonaws.kafka.config.providers.SecretsManagerConfigProvider
            config.providers.secretsmanager.param.region=${AWS::Region}
      Tags:
      - Key: modernizer:job-id
        Value: wordpress-example
      - Key: modernizer:wave
        Value: '2'
  Connector:
    Type: AWS::KafkaConnect::Connector
    Properties:
      ConnectorName:
        Ref: ConnectorName
      ConnectorDescription: Debezium MySQL CDC into compacted per-table topics (job wordpress-example,
        wave 2)
      KafkaConnectVersion:
        Ref: KafkaConnectVersion
      Capacity:
        ProvisionedCapacity:
          McuCount:
            Ref: McuCount
          WorkerCount: 1
      KafkaCluster:
        ApacheKafkaCluster:
          BootstrapServers:
            Ref: BootstrapServers
          Vpc:
            SecurityGroups:
              Ref: SecurityGroupIds
            Subnets:
              Ref: SubnetIds
      KafkaClusterClientAuthentication:
        AuthenticationType: IAM
      KafkaClusterEncryptionInTransit:
        EncryptionType: TLS
      Plugins:
      - CustomPlugin:
          CustomPluginArn:
            Fn::GetAtt:
            - Plugin
            - CustomPluginArn
          Revision:
            Fn::GetAtt:
            - Plugin
            - Revision
      WorkerConfiguration:
        WorkerConfigurationArn:
          Fn::GetAtt:
          - WorkerConfiguration
          - WorkerConfigurationArn
        Revision:
          Fn::GetAtt:
          - WorkerConfiguration
          - Revision
      ServiceExecutionRoleArn:
        Fn::GetAtt:
        - ExecutionRole
        - Arn
      LogDelivery:
        WorkerLogDelivery:
          CloudWatchLogs:
            Enabled: true
            LogGroup:
              Ref: WorkerLogGroup
      ConnectorConfiguration:
        connector.class: io.debezium.connector.mysql.MySqlConnector
        tasks.max: '1'
        database.hostname:
          Ref: DatabaseHost
        database.port:
          Ref: DatabasePort
        database.user:
          Fn::Sub:
          - ${!secretsmanager:${SecretArn}:username}
          - SecretArn:
              Fn::Join:
              - '%3A'
              - Fn::Split:
                - ':'
                - Fn::Join:
                  - '%2B'
                  - Fn::Split:
                    - +
                    - Ref: DatabaseSecretArn
        database.password:
          Fn::Sub:
          - ${!secretsmanager:${SecretArn}:password}
          - SecretArn:
              Fn::Join:
              - '%3A'
              - Fn::Split:
                - ':'
                - Fn::Join:
                  - '%2B'
                  - Fn::Split:
                    - +
                    - Ref: DatabaseSecretArn
        database.server.id:
          Ref: DatabaseServerId
        database.ssl.mode:
          Ref: DatabaseSslMode
        database.include.list: wordpress
        table.include.list: wordpress\.wp_options,wordpress\.wp_posts,wordpress\.wp_postmeta,wordpress\.wp_users,wordpress\.wp_usermeta,wordpress\.wp_term_relationships
        topic.prefix: wordpress
        snapshot.mode: initial
        message.key.columns: wordpress.wp_options:option_id;wordpress.wp_posts:ID;wordpress.wp_postmeta:meta_id;wordpress.wp_users:ID;wordpress.wp_usermeta:umeta_id;wordpress.wp_term_relationships:object_id,term_taxonomy_id
        tombstones.on.delete: 'true'
        heartbeat.interval.ms: '10000'
        topic.heartbeat.prefix: __debezium-heartbeat.wave-2
        signal.enabled.channels: source
        signal.data.collection: wordpress.debezium_signal
        key.converter: org.apache.kafka.connect.json.JsonConverter
        key.converter.schemas.enable: 'false'
        value.converter: org.apache.kafka.connect.json.JsonConverter
        value.converter.schemas.enable: 'false'
        decimal.handling.mode: string
        include.schema.changes: 'false'
        schema.history.internal.kafka.topic: wordpress.schema-history.wave-2
        schema.history.internal.name: wordpress-wave-2-schemahistory
        schema.history.internal.consumer.group.id: wordpress-wave-2-schemahistory
        schema.history.internal.kafka.bootstrap.servers:
          Ref: BootstrapServers
        schema.history.internal.store.only.captured.tables.ddl: 'true'
        schema.history.internal.producer.security.protocol: SASL_SSL
        schema.history.internal.producer.sasl.mechanism: AWS_MSK_IAM
        schema.history.internal.producer.sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule
          required;
        schema.history.internal.producer.sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
        schema.history.internal.consumer.security.protocol: SASL_SSL
        schema.history.internal.consumer.sasl.mechanism: AWS_MSK_IAM
        schema.history.internal.consumer.sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule
          required;
        schema.history.internal.consumer.sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
        topic.creation.default.replication.factor:
          Ref: TopicReplicationFactor
        topic.creation.default.partitions: '1'
        topic.creation.default.cleanup.policy: compact
        topic.creation.groups: wordpress_wp_options,wordpress_wp_posts,wordpress_wp_postmeta,wordpress_wp_users,wordpress_wp_usermeta,wordpress_wp_term_relationships
        topic.creation.wordpress_wp_options.include: wordpress\.wordpress\.wp_options
        topic.creation.wordpress_wp_options.replication.factor:
          Ref: TopicReplicationFactor
        topic.creation.wordpress_wp_options.partitions: '1'
        topic.creation.wordpress_wp_options.cleanup.policy: compact
        topic.creation.wordpress_wp_posts.include: wordpress\.wordpress\.wp_posts
        topic.creation.wordpress_wp_posts.replication.factor:
          Ref: TopicReplicationFactor
        topic.creation.wordpress_wp_posts.partitions: '3'
        topic.creation.wordpress_wp_posts.cleanup.policy: compact
        topic.creation.wordpress_wp_postmeta.include: wordpress\.wordpress\.wp_postmeta
        topic.creation.wordpress_wp_postmeta.replication.factor:
          Ref: TopicReplicationFactor
        topic.creation.wordpress_wp_postmeta.partitions: '6'
        topic.creation.wordpress_wp_postmeta.cleanup.policy: compact
        topic.creation.wordpress_wp_users.include: wordpress\.wordpress\.wp_users
        topic.creation.wordpress_wp_users.replication.factor:
          Ref: TopicReplicationFactor
        topic.creation.wordpress_wp_users.partitions: '1'
        topic.creation.wordpress_wp_users.cleanup.policy: compact
        topic.creation.wordpress_wp_usermeta.include: wordpress\.wordpress\.wp_usermeta
        topic.creation.wordpress_wp_usermeta.replication.factor:
          Ref: TopicReplicationFactor
        topic.creation.wordpress_wp_usermeta.partitions: '3'
        topic.creation.wordpress_wp_usermeta.cleanup.policy: compact
        topic.creation.wordpress_wp_term_relationships.include: wordpress\.wordpress\.wp_term_relationships
        topic.creation.wordpress_wp_term_relationships.replication.factor:
          Ref: TopicReplicationFactor
        topic.creation.wordpress_wp_term_relationships.partitions: '1'
        topic.creation.wordpress_wp_term_relationships.cleanup.policy: compact
      Tags:
      - Key: modernizer:job-id
        Value: wordpress-example
      - Key: modernizer:wave
        Value: '2'
Outputs:
  ConnectorArn:
    Value:
      Fn::GetAtt:
      - Connector
      - ConnectorArn
  ExecutionRoleArn:
    Value:
      Fn::GetAtt:
      - ExecutionRole
      - Arn
  WorkerLogGroupName:
    Value:
      Ref: WorkerLogGroup
  CustomPluginArn:
    Value:
      Fn::GetAtt:
      - Plugin
      - CustomPluginArn
