Metadata:
  Modernizer::CustomerResponsibility:
    Disclaimer: 'Creating, configuring, securing and running this Aurora cluster, and running the DDL
      in step-1.ddl.sql, are your responsibility. This is a suggested starting point generated from your
      assessment, not a production-ready configuration: review every setting against your own requirements,
      policies and backups before you deploy it. The data movement stack (dms-step-1.yaml) needs the settings
      listed here; nothing we deploy changes the cluster''s configuration or runs inside it, and the DMS
      task only connects as the DMS user you create to write the rows.'
    RequiredSettings:
    - Setting: Engine and version
      Value: Aurora MySQL, the 8.0 line
      Reason: The Aurora design and its DDL target this engine line; another line may refuse the DDL or
        change how values convert.
    - Setting: binlog_format
      Value: ROW
      Reason: Later steps (change capture) read Aurora's changes from its binary log; row-based logging
        records every changed row. Set here at creation; changing it from OFF on a running cluster takes
        effect only after a reboot.
    - Setting: binlog_row_image
      Value: FULL
      Reason: Each logged change carries the whole row, so later steps rebuild it without reading Aurora.
    - Setting: local_infile
      Value: '1'
      Reason: 'AWS DMS writes the full load into a MySQL-compatible target with LOAD DATA LOCAL INFILE;
        the DMS guide''s MySQL-target prerequisites require local_infile = 1 (Using a MySQL-compatible
        database as a target for AWS DMS). An instance-level parameter, so it is in the writer''s DB parameter
        group: every instance of the cluster must use this DB parameter group, since a failover makes
        another instance the writer.'
    - Setting: sql_mode
      Value: ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      Reason: '41 date and time columns can hold zero dates (MySQL accepts them unless its sql_mode forbids
        them); 30 of them default to `0000-00-00`. Aurora MySQL 8.0''s default sql_mode is strict (STRICT_TRANS_TABLES)
        with NO_ZERO_DATE and NO_ZERO_IN_DATE, which rejects them, and the AWS DMS guide says zero DATETIME
        and TIMESTAMP values are recorded as NULL on a target that does not support them, so the load
        would change data without failing. This is the MySQL 8.0 default without those two modes; strict
        mode stays on. An instance-level parameter: every instance of the cluster must use this DB parameter
        group, since a failover makes another instance the writer. If the source holds no zero dates (check
        it), you can drop this setting.'
    - Setting: binlog retention hours
      Value: 24 or more
      Reason: CALL mysql.rds_set_configuration('binlog retention hours', 24); later steps read the binary
        log, so it must outlast an outage of their connector.
    - Setting: Encryption at rest
      Value: 'StorageEncrypted: true'
      Reason: The cluster holds a full copy of your production data; encryption is set at creation and
        cannot be turned on in place.
    - Setting: Writer endpoint
      Value: reachable from the DMS replication instance on the database port
      Reason: DMS writes through the cluster's writer endpoint from the subnets of dms-step-1.yaml; allow
        its security group in the cluster's.
    - Setting: DMS user
      Value: the user and grants after the tables in step-1.ddl.sql
      Reason: The DMS target endpoint signs in as this user, from the TargetSecretArn secret (JSON keys
        username, password, host and port), not as the administrator.
    - Setting: TLS
      Value: available; require_secure_transport may be ON (the 8.4 default)
      Reason: The DMS target endpoint always connects with TLS (verify-ca), so a cluster that requires
        TLS is fine.
Parameters:
