    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets in at least two Availability Zones for the cluster
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security groups of the cluster; allow the DMS replication instance on the database port
  EngineVersion:
    Type: String
    Description: Aurora MySQL engine version on the 8.0 line (aws rds describe-db-engine-versions --engine
      aurora-mysql)
    AllowedPattern: ^8\.0\..+$
  ParameterGroupFamily:
    Type: String
    Description: 'Parameter group family: the engine version''s line'
    AllowedValues:
    - aurora-mysql8.0
    - aurora-mysql8.4
    Default: aurora-mysql8.0
  InstanceClass:
    Type: String
    Description: Writer instance class
    Default: db.r6g.large
    AllowedPattern: ^db\.[a-z0-9]+\.[a-z0-9]+$
  MasterUsername:
    Type: String
    Description: Administrator user (its password is generated and kept in Secrets Manager)
    Default: dbadmin
    AllowedPattern: ^[A-Za-z][A-Za-z0-9_]{0,15}$
  BackupRetentionDays:
    Type: Number
    Description: Automated backup retention in days
    Default: 7
    MinValue: 7
    MaxValue: 35
  KmsKeyArn:
    Type: String
    Description: 'Customer managed KMS key ARN for storage encryption (empty: the AWS managed key)'
    Default: ''
    AllowedPattern: ^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$
