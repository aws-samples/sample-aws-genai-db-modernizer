AWSTemplateFormatVersion: '2010-09-09'
Description: 'SUGGESTED Aurora PostgreSQL cluster for step 1 of job job1. Creating and running it is your
  responsibility: read the header and the Metadata before you deploy it. Generated by scripts/render_dms_step.py.'
