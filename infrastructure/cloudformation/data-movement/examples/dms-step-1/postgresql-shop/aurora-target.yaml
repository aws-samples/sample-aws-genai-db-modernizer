      task only connects as the DMS user you create to write the rows.'
    RequiredSettings:
    - Setting: Engine and version
      Value: Aurora PostgreSQL, the 16 line
      Reason: The Aurora design and its DDL target this engine line; another line may refuse the DDL or
        change how values convert.
    - Setting: rds.logical_replication
      Value: '1'
      Reason: 'Later steps (change capture) read Aurora''s changes through logical replication. A static
        parameter: set here at creation; changing it later takes effect only after a reboot.'
    - Setting: Encryption at rest
      Value: 'StorageEncrypted: true'
      Reason: The cluster holds a full copy of your production data; encryption is set at creation and
        cannot be turned on in place.
    - Setting: Writer endpoint
      Value: reachable from the DMS replication instance on the database port
      Reason: DMS writes through the cluster's writer endpoint from the subnets of dms-step-1.yaml; allow
        its security group in the cluster's.
    - Setting: DMS user
      Value: the user and grants after the tables in step-1.ddl.sql
      Reason: The DMS target endpoint signs in as this user, from the TargetSecretArn secret (JSON keys
        username, password, host and port), not as the administrator.
    - Setting: TLS
      Value: available; rds.force_ssl may be on
      Reason: The DMS target endpoint always connects with TLS (verify-full with the CA certificate, require
        without it), so a cluster that requires TLS is fine.
Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets in at least two Availability Zones for the cluster
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security groups of the cluster; allow the DMS replication instance on the database port
  EngineVersion:
    Type: String
    Description: Aurora PostgreSQL engine version on the 16 line (aws rds describe-db-engine-versions
      --engine aurora-postgresql)
    AllowedPattern: ^16\.
  ParameterGroupFamily:
    Type: String
    Description: 'Parameter group family: the engine version''s line'
    AllowedValues:
    - aurora-postgresql14
    - aurora-postgresql15
    - aurora-postgresql16
    - aurora-postgresql17
    - aurora-postgresql18
    Default: aurora-postgresql16
  InstanceClass:
    Type: String
    Description: Writer instance class
    Default: db.r6g.large
    AllowedPattern: ^db\.[a-z0-9]+\.[a-z0-9]+$
  MasterUsername:
    Type: String
    Description: Administrator user (its password is generated and kept in Secrets Manager)
    Default: dbadmin
    AllowedPattern: ^[A-Za-z][A-Za-z0-9_]{0,15}$
  BackupRetentionDays:
    Type: Number
    Description: Automated backup retention in days
    Default: 7
    MinValue: 7
    MaxValue: 35
  KmsKeyArn:
    Type: String
    Description: 'Customer managed KMS key ARN for storage encryption (empty: the AWS managed key)'
    Default: ''
    AllowedPattern: ^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$
  DatabaseName:
    Type: String
    AllowedPattern: ^[A-Za-z][A-Za-z0-9_]{0,62}$
    Description: Database the cluster creates; the DDL creates the tables in it
    Default: shop
Conditions:
  HasKmsKey:
    Fn::Not:
    - Fn::Equals:
      - Ref: KmsKeyArn
      - ''
Resources:
  ClusterParameterGroup:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      Description: The cluster settings step 1 and the later steps need (see the Metadata)
      Family:
        Ref: ParameterGroupFamily
      Parameters:
        rds.logical_replication: '1'
      Tags:
      - Key: modernizer:job-id
        Value: job1
      - Key: modernizer:step
        Value: '1'
      - Key: modernizer:contract-sha256
        Value: 2a66ca742ae11a71014c56ff5d55da34c77295b05b8e79e63637aaf15304335c
  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets of the step 1 Aurora cluster (job job1)
      SubnetIds:
        Ref: SubnetIds
      Tags:
      - Key: modernizer:job-id
        Value: job1
      - Key: modernizer:step
        Value: '1'
      - Key: modernizer:contract-sha256
        Value: 2a66ca742ae11a71014c56ff5d55da34c77295b05b8e79e63637aaf15304335c
  Cluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      EngineVersion:
        Ref: EngineVersion
      DBClusterParameterGroupName:
        Ref: ClusterParameterGroup
      DBSubnetGroupName:
        Ref: SubnetGroup
      VpcSecurityGroupIds:
        Ref: SecurityGroupIds
      MasterUsername:
        Ref: MasterUsername
      ManageMasterUserPassword: true
      StorageEncrypted: true
      KmsKeyId:
        Fn::If:
        - HasKmsKey
        - Ref: KmsKeyArn
        - Ref: AWS::NoValue
      DeletionProtection: true
      EnableIAMDatabaseAuthentication: true
      BackupRetentionPeriod:
        Ref: BackupRetentionDays
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports:
      - postgresql
      Tags:
      - Key: modernizer:job-id
        Value: job1
      - Key: modernizer:step
        Value: '1'
      - Key: modernizer:contract-sha256
        Value: 2a66ca742ae11a71014c56ff5d55da34c77295b05b8e79e63637aaf15304335c
      DatabaseName:
        Ref: DatabaseName
  Writer:
    Type: AWS::RDS::DBInstance
    Metadata:
      checkov:
        skip:
        - id: CKV_AWS_118
          comment: Enhanced monitoring needs a monitoring IAM role this suggestion does not create; CloudWatch
            metrics and the exported logs cover step 1. Turn it on with your own role if you need it.
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier:
        Ref: Cluster
      DBInstanceClass:
        Ref: InstanceClass
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      Tags:
      - Key: modernizer:job-id
        Value: job1
      - Key: modernizer:step
        Value: '1'
      - Key: modernizer:contract-sha256
        Value: 2a66ca742ae11a71014c56ff5d55da34c77295b05b8e79e63637aaf15304335c
Outputs:
  ClusterIdentifier:
    Value:
      Ref: Cluster
  WriterEndpoint:
    Value:
      Fn::GetAtt:
      - Cluster
      - Endpoint.Address
  Port:
    Value:
      Fn::GetAtt:
      - Cluster
      - Endpoint.Port
  MasterUserSecretArn:
