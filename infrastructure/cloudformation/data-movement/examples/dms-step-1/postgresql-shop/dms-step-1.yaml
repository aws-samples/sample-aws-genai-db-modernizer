# GENERATED by scripts/render_dms_step.py from step 1's plan and transformation contract;
# regenerate it rather than editing it.
AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS DMS full load and ongoing replication for step 1 of job job1: the postgresql database
  shop into Aurora PostgreSQL. GENERATED by scripts/render_dms_step.py from the step''s plan and transformation
  contract; regenerate it rather than editing it. Needs the account-wide DMS roles dms-vpc-role and dms-cloudwatch-logs-role
  (this stack does not create them). Deploy it only after your Aurora cluster has every setting aurora-target.yaml
  lists and every table of step-1.ddl.sql exists: the task creates no table.'
Metadata:
  PrerequisiteRoles:
    dms-vpc-role: DMS manages the replication subnet group and the instance's network interfaces with
      it (managed policy AmazonDMSVPCManagementRole)
    dms-cloudwatch-logs-role: DMS writes the task's logs to CloudWatch Logs with it (managed policy AmazonDMSCloudWatchLogsRole)
Parameters:
  InstanceClass:
    Type: String
    Default: dms.t3.medium
    AllowedPattern: ^dms\.[a-z0-9]+\.[a-z0-9]+$
    Description: 'Replication instance class. Sized from the collection: 0.5 GB and 3.5 writes per second:
      up to 10 GB and 50 writes per second.'
  EngineVersion:
    Type: String
    Default: 3.6.1
    AllowedPattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    Description: AWS DMS engine version of the replication instance. On the default engine (3.5.4) the
      data validator can fail to read an endpoint secret and retry one table indefinitely, which stalls
      validation on large sources; on 3.6.1 it re-reads the secret and recovers. From a PostgreSQL source,
      3.6.1 was checked in a live step 1 run (#2021).
  AllocatedStorage:
    Type: Number
    Default: 50
    MinValue: 5
    MaxValue: 6144
    Description: Replication instance storage in GB (task logs and cached changes)
  MultiAZ:
    Type: String
    Description: Run the replication instance in two Availability Zones (the step's cost prices true;
      false halves the instance price, for a demo)
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets in at least two Availability Zones that reach the source and the Aurora
      writer endpoint; DMS reads the endpoint secrets from them, so it needs a Secrets Manager interface
      endpoint with private DNS, or a NAT route
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: 'Security groups of the replication instance: egress on the database ports to the source
      and the cluster (whose groups must allow it) and egress on 443 to Secrets Manager'
  SecretsManagerEndpointOverride:
    Type: String
    Description: 'DNS name of the Secrets Manager interface VPC endpoint, only when that endpoint has
      no private DNS (empty: the regional Secrets Manager endpoint)'
    AllowedPattern: ^$|^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)+$
    Default: ''
  SourceSecretArn:
    Type: String
    Description: 'Full ARN of the Secrets Manager secret of the source database (the DMS user): JSON keys
      username, password, host and port. Not the RDS-managed master secret, which has no host or port'
    AllowedPattern: ^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$
  TargetSecretArn:
    Type: String
    Description: 'Full ARN of the Secrets Manager secret of the Aurora writer endpoint (the DMS user):
      JSON keys username, password, host and port. Not the RDS-managed master secret, which has no host
      or port'
    AllowedPattern: ^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$
  SourceSecretKmsKeyArn:
    Type: String
    Description: Customer managed KMS key ARN that encrypts the source secret (empty when it uses the
      AWS managed key)
    AllowedPattern: ^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$
    Default: ''
  TargetSecretKmsKeyArn:
    Type: String
    Description: Customer managed KMS key ARN that encrypts the target secret (empty when it uses the
      AWS managed key)
    AllowedPattern: ^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$
    Default: ''
  SourceCertificateArn:
    Type: String
    Description: ARN of the DMS certificate (aws dms import-certificate) of the source database's certificate
      authority; when set, the server certificate and host name are verified (verify-full), otherwise
      the connection is encrypted only (require)
    AllowedPattern: ^$|^arn:aws[a-z-]*:dms:[a-z0-9-]+:[0-9]{12}:cert:[A-Za-z0-9-]+$
    Default: ''
  TargetCertificateArn:
    Type: String
    Description: ARN of the DMS certificate (aws dms import-certificate) of the Aurora cluster's certificate
      authority; when set, the server certificate and host name are verified (verify-full), otherwise
      the connection is encrypted only (require)
    AllowedPattern: ^$|^arn:aws[a-z-]*:dms:[a-z0-9-]+:[0-9]{12}:cert:[A-Za-z0-9-]+$
    Default: ''
  ReplicationKmsKeyArn:
    Type: String
    Description: 'Customer managed KMS key ARN for the replication instance''s storage (empty: the DMS
      default key)'
    AllowedPattern: ^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$
    Default: ''
  SourceDatabaseName:
    Type: String
    Description: Source database name
    AllowedPattern: ^[A-Za-z_][A-Za-z0-9_$]{0,62}$
    Default: shop
  TargetDatabaseName:
    Type: String
    Description: Aurora database the DDL created the tables in
    AllowedPattern: ^[A-Za-z_][A-Za-z0-9_$]{0,62}$
    Default: shop
  TaskIdentifier:
    Type: String
    Description: Replication task identifier
    AllowedPattern: ^[a-zA-Z][a-zA-Z0-9]*(?:-[a-zA-Z0-9]+)*$
    Default: dm-job1-step-1
    MaxLength: 255
Conditions:
  IsMultiAZ:
    Fn::Equals:
    - Ref: MultiAZ
    - 'true'
  HasSourceCertificate:
    Fn::Not:
    - Fn::Equals:
      - Ref: SourceCertificateArn
      - ''
  HasTargetCertificate:
    Fn::Not:
    - Fn::Equals:
      - Ref: TargetCertificateArn
      - ''
  HasSourceSecretKey:
    Fn::Not:
    - Fn::Equals:
      - Ref: SourceSecretKmsKeyArn
      - ''
  HasTargetSecretKey:
    Fn::Not:
    - Fn::Equals:
      - Ref: TargetSecretKmsKeyArn
      - ''
  HasReplicationKey:
    Fn::Not:
    - Fn::Equals:
      - Ref: ReplicationKmsKeyArn
      - ''
  HasSecretsManagerEndpointOverride:
    Fn::Not:
    - Fn::Equals:
      - Ref: SecretsManagerEndpointOverride
      - ''
Resources:
  SecretsAccessRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W76
          reason: One statement per resource scope (the two secrets, then Decrypt and DescribeKey on each
            optional secret key); every action is listed and every resource is scoped, which is what raises
            the complexity score
    Properties:
      Description: Lets DMS read the two endpoint secrets of this step, and nothing else
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
              Fn::Sub: dms.${AWS::Region}.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: read-endpoint-secrets
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:DescribeSecret
            Resource:
            - Ref: SourceSecretArn
            - Ref: TargetSecretArn
          - Fn::If:
            - HasSourceSecretKey
            - Effect: Allow
              Action: kms:Decrypt
              Resource:
                Ref: SourceSecretKmsKeyArn
              Condition:
                StringEquals:
                  kms:ViaService:
                    Fn::Sub: secretsmanager.${AWS::Region}.amazonaws.com
            - Ref: AWS::NoValue
          - Fn::If:
            - HasSourceSecretKey
            - Effect: Allow
              Action: kms:DescribeKey
              Resource:
                Ref: SourceSecretKmsKeyArn
            - Ref: AWS::NoValue
          - Fn::If:
            - HasTargetSecretKey
            - Effect: Allow
              Action: kms:Decrypt
              Resource:
                Ref: TargetSecretKmsKeyArn
              Condition:
                StringEquals:
                  kms:ViaService:
                    Fn::Sub: secretsmanager.${AWS::Region}.amazonaws.com
            - Ref: AWS::NoValue
          - Fn::If:
            - HasTargetSecretKey
            - Effect: Allow
              Action: kms:DescribeKey
              Resource:
                Ref: TargetSecretKmsKeyArn
            - Ref: AWS::NoValue
      Tags:
      - Key: modernizer:job-id
        Value: job1
      - Key: modernizer:step
        Value: '1'
      - Key: modernizer:contract-sha256
        Value: 2a66ca742ae11a71014c56ff5d55da34c77295b05b8e79e63637aaf15304335c
  SubnetGroup:
    Type: AWS::DMS::ReplicationSubnetGroup
    Properties:
      ReplicationSubnetGroupDescription: Step 1 replication subnets for job job1
      SubnetIds:
        Ref: SubnetIds
      Tags:
      - Key: modernizer:job-id
        Value: job1
      - Key: modernizer:step
        Value: '1'
      - Key: modernizer:contract-sha256
        Value: 2a66ca742ae11a71014c56ff5d55da34c77295b05b8e79e63637aaf15304335c
  ReplicationInstance:
    Type: AWS::DMS::ReplicationInstance
    Properties:
      ReplicationInstanceClass:
        Ref: InstanceClass
      AllocatedStorage:
        Ref: AllocatedStorage
      MultiAZ:
        Fn::If:
        - IsMultiAZ
        - true
        - false
      PubliclyAccessible: false
      EngineVersion:
        Ref: EngineVersion
      AutoMinorVersionUpgrade: true
      ReplicationSubnetGroupIdentifier:
        Ref: SubnetGroup
      VpcSecurityGroupIds:
        Ref: SecurityGroupIds
      KmsKeyId:
        Fn::If:
        - HasReplicationKey
        - Ref: ReplicationKmsKeyArn
        - Ref: AWS::NoValue
      Tags:
      - Key: modernizer:job-id
        Value: job1
      - Key: modernizer:step
        Value: '1'
      - Key: modernizer:contract-sha256
        Value: 2a66ca742ae11a71014c56ff5d55da34c77295b05b8e79e63637aaf15304335c
  SourceEndpoint:
    Type: AWS::DMS::Endpoint
    Properties:
      EndpointType: source
      EngineName: postgres
      SslMode:
        Fn::If:
        - HasSourceCertificate
        - verify-full
        - require
      CertificateArn:
        Fn::If:
        - HasSourceCertificate
        - Ref: SourceCertificateArn
        - Ref: AWS::NoValue
      PostgreSqlSettings:
        SecretsManagerSecretId:
          Ref: SourceSecretArn
        SecretsManagerAccessRoleArn:
          Fn::GetAtt:
          - SecretsAccessRole
          - Arn
        CaptureDdls: false
        HeartbeatEnable: true
        FailTasksOnLobTruncation: true
      DatabaseName:
        Ref: SourceDatabaseName
      ExtraConnectionAttributes:
        Fn::If:
        - HasSecretsManagerEndpointOverride
        - Fn::Sub: unboundedVarcharMaxSize=10485760;secretsManagerEndpointOverride=${SecretsManagerEndpointOverride}
        - unboundedVarcharMaxSize=10485760
      Tags:
      - Key: modernizer:job-id
        Value: job1
      - Key: modernizer:step
        Value: '1'
      - Key: modernizer:contract-sha256
        Value: 2a66ca742ae11a71014c56ff5d55da34c77295b05b8e79e63637aaf15304335c
  TargetEndpoint:
    Type: AWS::DMS::Endpoint
    Properties:
      EndpointType: target
      EngineName: aurora-postgresql
      SslMode:
        Fn::If:
        - HasTargetCertificate
        - verify-full
        - require
      CertificateArn:
        Fn::If:
        - HasTargetCertificate
        - Ref: TargetCertificateArn
        - Ref: AWS::NoValue
      PostgreSqlSettings:
        SecretsManagerSecretId:
          Ref: TargetSecretArn
        SecretsManagerAccessRoleArn:
          Fn::GetAtt:
          - SecretsAccessRole
          - Arn
        AfterConnectScript: SET session_replication_role = replica
      DatabaseName:
        Ref: TargetDatabaseName
      ExtraConnectionAttributes:
        Fn::If:
        - HasSecretsManagerEndpointOverride
        - Fn::Sub: secretsManagerEndpointOverride=${SecretsManagerEndpointOverride}
        - Ref: AWS::NoValue
      Tags:
      - Key: modernizer:job-id
        Value: job1
      - Key: modernizer:step
        Value: '1'
      - Key: modernizer:contract-sha256
        Value: 2a66ca742ae11a71014c56ff5d55da34c77295b05b8e79e63637aaf15304335c
  ReplicationTask:
    Type: AWS::DMS::ReplicationTask
    Properties:
      ReplicationTaskIdentifier:
        Ref: TaskIdentifier
      MigrationType: full-load-and-cdc
      ReplicationInstanceArn:
        Ref: ReplicationInstance
      SourceEndpointArn:
        Ref: SourceEndpoint
      TargetEndpointArn:
        Ref: TargetEndpoint
      TableMappings: |-
        {"rules":[
        {"rule-type":"selection","rule-id":"1","rule-name":"1","object-locator":{"schema-name":"public","table-name":"audit_log"},"rule-action":"include"},
        {"rule-type":"selection","rule-id":"2","rule-name":"2","object-locator":{"schema-name":"public","table-name":"customers"},"rule-action":"include"},
        {"rule-type":"selection","rule-id":"3","rule-name":"3","object-locator":{"schema-name":"public","table-name":"orders"},"rule-action":"include"}
        ]}
      ReplicationTaskSettings: |-
        {
          "TargetMetadata": {
            "SupportLobs": true,
            "FullLobMode": false,
            "LobChunkSize": 64,
            "LimitedSizeLobMode": true,
            "LobMaxSize": 64,
            "BatchApplyEnabled": false
          },
          "FullLoadSettings": {
            "TargetTablePrepMode": "DO_NOTHING"
          },
          "ChangeProcessingDdlHandlingPolicy": {
            "HandleSourceTableDropped": false,
            "HandleSourceTableTruncated": false,
            "HandleSourceTableAltered": false
          },
          "ValidationSettings": {
            "EnableValidation": true,
            "ValidationMode": "ROW_LEVEL",
            "ThreadCount": 5
          },
          "Logging": {
            "EnableLogging": true
          }
        }
      Tags:
      - Key: modernizer:job-id
        Value: job1
      - Key: modernizer:step
        Value: '1'
      - Key: modernizer:contract-sha256
        Value: 2a66ca742ae11a71014c56ff5d55da34c77295b05b8e79e63637aaf15304335c
Outputs:
  ReplicationInstanceArn:
    Value:
      Ref: ReplicationInstance
  ReplicationTaskArn:
    Value:
      Ref: ReplicationTask
  SourceEndpointArn:
    Value:
      Ref: SourceEndpoint
  TargetEndpointArn:
    Value:
      Ref: TargetEndpoint
  SecretsAccessRoleArn:
    Value:
      Fn::GetAtt:
      - SecretsAccessRole
      - Arn
